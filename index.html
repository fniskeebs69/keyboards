<style>
  :root {
    --bg: #0f1115; --bg-2: #13161c; --side: #12151b;
    --surface: #181c24; --surface-2: #20252f; --line: #282e3a; --line-2: #323949;
    --text: #e9ebf0; --text-2: #a3a9b8; --text-3: #6d7486;
    --kb: #f5a524; --sw: #fb7185; --kc: #2dd4bf; --pcb: #4ade80; --ac: #a78bfa; --ar: #38bdf8; --neutral: #f5a524;
    --accent: var(--kb);
    --radius: 14px;
    --side-w: 236px;
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; background: linear-gradient(to right, var(--side) var(--side-w), var(--bg) var(--side-w)); }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line);
    padding: calc(16px + var(--safe-top)) 12px 16px; display: flex; flex-direction: column; }
  .brandmark { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; }
  .brandmark .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--kb) 16%, transparent); color: var(--kb); }
  .brandmark .logo svg { width: 20px; height: 20px; }
  .brandmark b { display: block; font-size: 15px; letter-spacing: -.01em; }
  .brandmark span { display: block; font-size: 11.5px; color: var(--text-3); }
  .navgroup { margin: 10px 0 4px; padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--text-3); }
  .navitem { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--text-2);
    font-weight: 550; margin: 1px 0; border: 1px solid transparent; }
  .navitem svg { width: 18px; height: 18px; color: var(--c, var(--text-3)); flex: none; }
  .navitem:hover { background: var(--surface); color: var(--text); }
  .navitem.on { background: color-mix(in srgb, var(--c, var(--kb)) 12%, var(--surface)); color: var(--text);
    border-color: color-mix(in srgb, var(--c, var(--kb)) 30%, transparent); }
  .navitem .soon { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--text-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
  .side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text-3); display: grid; gap: 6px; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .dot.ok { background: #34d399; } .dot.bad { background: #f87171; }

  .main { min-width: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: calc(26px + var(--safe-top)) 32px 48px; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .pagehead h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .pagehead p { margin: 4px 0 0; color: var(--text-2); }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  #protoWarn { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: #3a1d22; border: 1px solid #7a2e3a; color: #ffd7dc; line-height: 1.45; }
  #protoWarn strong { color: #fff; }

  /* ---------- Controls ---------- */
  .btn { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #14110a; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.danger:hover:not(:disabled) { border-color: #f87171; color: #fecaca; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }
  .select, .input { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; outline: none; }
  .select:focus, .input:focus { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .seg button { background: var(--surface); border: 0; padding: 8px 12px; cursor: pointer; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--surface-2); color: var(--accent); font-weight: 650; }
  .seg svg { width: 15px; height: 15px; }
  .search { position: relative; flex: 1; min-width: 260px; }
  .search input { width: 100%; padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-3); }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  .chip.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .sub { margin: 0 0 14px; color: var(--text-2); font-size: 13px; line-height: 1.5; }
  .note { font-size: 12.5px; color: var(--text-2); border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--line));
    background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 10px; padding: 9px 12px; margin-bottom: 16px; }

  /* ---------- Dashboard ---------- */
  .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .tile { display: flex; gap: 16px; align-items: flex-start; text-decoration: none; position: relative; }
  .tile .ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .tile .ic svg { width: 24px; height: 24px; }
  .tile .lbl { color: var(--text-2); font-size: 14px; }
  .tile .big { font-size: 34px; font-weight: 750; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--text-3); font-size: 12.5px; }
  .tile .hint.good { color: #34d399; }
  .tile .eye { position: absolute; right: 14px; top: 14px; }

/* ===================== Step 2.7: Photos (D12: stored in Firestore as WebP) =====================

const PHOTO_FULL = { w: 1600, h: 1200, q: [0.82, 0.72, 0.6] };

function photoCardHtml(k, type = 'keyboards') {
  return `<div class="card side-card" id="photoCard"><h3>Primary photo</h3><p class="sub">Shown on the gallery card. Pick any photo below as the default.</p>

    <div class="drop" id="dropZone" tabindex="0" role="button" aria-label="Add photos"><b>Drop photos here or click to upload</b><span>JPG, PNG or WebP. Each one can be cropped before it is saved.</span></div>

}
function wirePhotos(k, type = 'keyboards') {

  const ready = !!db && !isFile;
  if (!ready) { zone.classList.add('off'); zone.innerHTML = '<b>Photos need Firebase</b><span>Open the https site to add photos.</span>'; document.getElementById('photoGrid').innerHTML = ''; return; }
  zone.onclick = () => input.click();

async function setCover(itemId, p) {

function loadImage(src) {
  return new Promise((res, rej) => { const img = new Image(); img.onload = () => res(img); img.onerror = () => rej(new Error('This file could not be read as an image. iPhone HEIC photos need to be saved as JPG first.')); img.src = src; });
}

async function queuePhotos(k, files) {
  const imgs = files.filter(f => /^image\/(jpeg|png|webp)$/.test(f.type));
  if (files.length && !imgs.length) { toast('Only JPG, PNG or WebP images can be added.'); return; }
  if (files.length > imgs.length) toast(`${files.length - imgs.length} file(s) skipped: only JPG, PNG or WebP.`);
  if (photoQueueBusy) { toast('Finish the current photo first.'); return; }
  photoQueueBusy = true;
  try {
    for (let i = 0; i < imgs.length; i++) {
      const f = imgs[i];
      let img;
      try { img = await loadImage(await fileToDataUrl(f)); } catch (e) { toast(f.name + ': ' + e.message); continue; }
      const out = await cropDialog(img, f.name, imgs.length > 1 ? `Photo ${i + 1} of ${imgs.length}` : '');

async function addPhoto(k, out, fileName) {

    await metaRef().set({ photoCount: firebase.firestore.FieldValue.increment(1), photoBytes: firebase.firestore.FieldValue.increment(out.bytes) }, { merge: true });
    const cur = photoItem(k);
    if (!cur.coverPhotoId) await setCover(k.id, { id: ref.id, thumb: out.thumb });
    toast('Photo saved');
  } catch (e) { toast('Photo not saved: ' + explain(e)); }
}
async function replacePhoto(k, p, out) {

    await withTimeout(photoCol().doc(p.id).update({ full: out.full, thumb: out.thumb, bytes: out.bytes, width: out.width, height: out.height }), 30000);
    await metaRef().set({ photoBytes: firebase.firestore.FieldValue.increment(out.bytes - (p.bytes || 0)) }, { merge: true });
    const cur = photoItem(k);
    if (cur.coverPhotoId === p.id) await setCover(k.id, { id: p.id, thumb: out.thumb });

  } catch (e) { toast('Crop not saved: ' + explain(e)); }
}
async function deletePhoto(k, p) {
  if (!confirm('Delete this photo? This cannot be undone.')) return;

    await withTimeout(photoCol().doc(p.id).delete());
    await metaRef().set({ photoCount: firebase.firestore.FieldValue.increment(-1), photoBytes: firebase.firestore.FieldValue.increment(-(p.bytes || 0)) }, { merge: true });
    const cur = photoItem(k);
    if (cur.coverPhotoId === p.id) { const next = currentPhotos.find(x => x.id !== p.id); await setCover(k.id, next || null); }

async function deletePhotosOf(itemId) {   // used when a keyboard, switch entry or keycap set is deleted

  for (const d of snap.docs) { bytes += d.data().bytes || 0; n++; await d.ref.delete(); }

/* ---------- Crop dialog: drag to move, zoom, rotate, live preview; output is 4:3 ---------- */
function cropDialog(img, fileName, counter = '') {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-bg';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Crop photo">
      <h3>Crop photo${counter ? ` <span class="sub">· ${esc(counter)}</span>` : ''}</h3>
      <p class="sub">Drag to move the photo and zoom so the card looks right. ${esc(fileName)}</p>
      <div class="crop-row">
        <canvas id="cropCv" width="640" height="480" class="cropcv"></canvas>
        <div class="crop-side">
          <div class="k">Card preview</div><canvas id="cropPv" width="240" height="180" class="croppv"></canvas>
          <div class="k" style="margin-top:14px">Zoom</div><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
          <div class="k" style="margin-top:14px">Rotate</div>
          <div class="btnrow"><button class="btn" id="rotL" aria-label="Rotate left">⟲ Left</button><button class="btn" id="rotR" aria-label="Rotate right">⟳ Right</button></div>
        </div>
      </div>
      <div class="btnrow" style="justify-content:flex-end;margin-top:16px">
        ${counter ? '<button class="btn" id="cropSkip">Skip this photo</button>' : ''}<button class="btn" id="cropCancel">Cancel</button><button class="btn primary" id="cropSave">Save crop</button></div></div>`;
    document.body.appendChild(wrap);
    const cv = wrap.querySelector('#cropCv'), pv = wrap.querySelector('#cropPv'), zoomEl = wrap.querySelector('#cropZoom');
    const st = { rot: 0, zoom: 1, x: 0, y: 0 };   // x,y = offset of image centre from frame centre, in frame pixels
    const srcW = () => (st.rot % 180 ? img.height : img.width), srcH = () => (st.rot % 180 ? img.width : img.height);
    const baseScale = (W, H) => Math.max(W / srcW(), H / srcH());   // "cover" fit at zoom 1
    function clamp() {
      const s = baseScale(cv.width, cv.height) * st.zoom, w = srcW() * s, h = srcH() * s;
      const mx = Math.max(0, (w - cv.width) / 2), my = Math.max(0, (h - cv.height) / 2);
      st.x = Math.min(mx, Math.max(-mx, st.x)); st.y = Math.min(my, Math.max(-my, st.y));
    }
    function draw(c) {
      const W = c.width, H = c.height, f = W / cv.width, ctx = c.getContext('2d');
      const s = baseScale(W, H) * st.zoom;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(W / 2 + st.x * f, H / 2 + st.y * f); ctx.rotate(st.rot * Math.PI / 180);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, -img.width * s / 2, -img.height * s / 2, img.width * s, img.height * s);
      ctx.restore();
    }
    const redraw = () => { clamp(); draw(cv); draw(pv); };
    let drag = null;
    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: st.x, sy: st.y }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!drag) return; const r = cv.width / cv.getBoundingClientRect().width; st.x = drag.sx + (e.clientX - drag.x) * r; st.y = drag.sy + (e.clientY - drag.y) * r; redraw(); });
    cv.addEventListener('pointerup', () => { drag = null; });
    cv.addEventListener('wheel', e => { e.preventDefault(); st.zoom = Math.min(4, Math.max(1, st.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08))); zoomEl.value = st.zoom; redraw(); }, { passive: false });
    zoomEl.oninput = () => { st.zoom = Number(zoomEl.value); redraw(); };
    wrap.querySelector('#rotL').onclick = () => { st.rot = (st.rot + 270) % 360; redraw(); };
    wrap.querySelector('#rotR').onclick = () => { st.rot = (st.rot + 90) % 360; redraw(); };
    const close = v => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    wrap.querySelector('#cropCancel').onclick = () => close(null);
    if (counter) wrap.querySelector('#cropSkip').onclick = () => close(null);
    wrap.querySelector('#cropSave').onclick = async () => {
      const btn = wrap.querySelector('#cropSave'); btn.disabled = true; btn.textContent = 'Saving…';
      // never upscale: the output is at most the photo's own resolution inside the frame
      const visW = cv.width / (baseScale(cv.width, cv.height) * st.zoom);
      const scaleW = Math.min(PHOTO_FULL.w, Math.round(visW));
      const fw = Math.max(320, Math.min(PHOTO_FULL.w, scaleW)), fh = Math.round(fw * 3 / 4);
      let full = '';
      for (const sizeStep of [1, 0.8, 0.64]) {
        const c = document.createElement('canvas'); c.width = Math.round(fw * sizeStep); c.height = Math.round(fh * sizeStep); draw(c);
        for (const q of PHOTO_FULL.q) { full = c.toDataURL('image/webp', q); if (full.length < MAX_DOC_CHARS) break; }
        if (full.length < MAX_DOC_CHARS) { var outW = c.width, outH = c.height; break; }
      }
      const t = document.createElement('canvas'); t.width = PHOTO_THUMB.w; t.height = PHOTO_THUMB.h; draw(t);
      const thumb = t.toDataURL('image/webp', PHOTO_THUMB.q);
      if (!full.startsWith('data:image/webp')) { toast('This browser cannot make WebP images; saving as JPEG instead.'); }
      close({ full, thumb, bytes: Math.round((full.length + thumb.length) * 3 / 4), width: outW, height: outH });
    };
    redraw();
  });
}

/* ===================== Step 4.5: Switches installed on keyboards =====================
   Each switch entry keeps allocations: [{ keyboardId, count }]. Loose = total count − installed. */
function allocsOf(w) { return Array.isArray(w.allocations) ? w.allocations : []; }
function installedCount(w) { return allocsOf(w).reduce((s, a) => s + (Number(a.count) || 0), 0); }
function looseCount(w) { return w.totalCount == null ? null : Math.max(0, Number(w.totalCount) - installedCount(w)); }
function kbLabel(k) { return [k.brand, k.name].filter(Boolean).join(' ') + (k.color ? ` (${k.color})` : ''); }
function switchesOn(kbId) { return savedSwitches.map(w => ({ w, a: allocsOf(w).find(a => a.keyboardId === kbId) })).filter(x => x.a); }
async function setAllocation(w, kbId, count) {
  const list = allocsOf(w).filter(a => a.keyboardId !== kbId);
  if (count > 0) list.push({ keyboardId: kbId, count });
  await withTimeout(swCol().doc(w.id).update({ allocations: list, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }));
}
function allocationProblem(w, kbId, count) {
  if (!kbId) return 'Pick a keyboard';
  if (!Number.isInteger(count) || count < 1) return 'Enter a whole number of 1 or more';
  const other = allocsOf(w).filter(a => a.keyboardId !== kbId).reduce((s, a) => s + (Number(a.count) || 0), 0);
  if (w.totalCount != null && other + count > Number(w.totalCount)) return `Only ${Math.max(0, Number(w.totalCount) - other)} of ${w.totalCount} are free`;
  return '';
}
function kbOptions(selected = '') {
  return savedKeyboards.slice().sort((a, b) => kbLabel(a).localeCompare(kbLabel(b), 'en', { sensitivity: 'base' }))
    .map(k => `<option value="${esc(k.id)}"${k.id === selected ? ' selected' : ''}>${esc(kbLabel(k))}</option>`).join('');
}
/* card on a switch entry's page */
function installedOnCardHtml(w) {

  return `<div class="card side-card" id="allocCard"><h3>Installed on</h3>
    <p class="sub" style="margin:0 0 10px">${w.totalCount == null ? 'Add a total count on the Overview tab to see how many are loose.' : `<b>${installedCount(w)}</b> installed · <b>${loose}</b> loose of ${w.totalCount}${w.countApprox ? ' (approximate)' : ''}`}</p>
    ${allocs.length ? `<div class="alist">${allocs.map(a => { const k = savedKeyboards.find(x => x.id === a.keyboardId);
      return `<div class="arow"><a class="lnk" href="#/keyboards/${esc(a.keyboardId)}">${esc(k ? kbLabel(k) : 'Deleted keyboard')}</a><span>${a.count}</span><button class="btn" data-unalloc="${esc(a.keyboardId)}" aria-label="Remove">✕</button></div>`; }).join('')}</div>` : ''}

  </div>`;
}
function wireInstalledOn(w) {

/* ===================== Step 5.5: Color palette on a keycap set (manual entry; catalog fill comes in 8.4) =====================

    <div class="pbody">

        <label>Hex (approximate)<span class="hexrow"><input type="color" class="c-pick" value="${hex || '#000000'}" aria-label="Pick a color"><input class="input c-hex mono" placeholder="#92ACA0" value="${val(c.hex)}"></span></label>
        <label>Pantone<input class="input c-pantone" placeholder="e.g. 5575 C" value="${val(c.pantone)}"></label>
        <label>RAL<input class="input c-ral" placeholder="e.g. 7044" value="${val(c.ral)}"></label>

      </div>

/* ===================== Step 8.1: Your own catalog, built from your records =====================

   The private GMK reference catalog (Step 8.0) will be added beside it later. */

  savedSwitches.forEach(w => { const r = add(sw, key(w.manufacturer + ' ' + w.name), () => ({ maker: w.manufacturer || '', name: w.name, type: w.switchType || '', specs: {}, n: 0, pcs: 0 })); r.n++; r.pcs += Number(w.totalCount) || 0;
    SW_SPEC_FIELDS.forEach(([f]) => { if (w[f] && !r.specs[f]) r.specs[f] = w[f]; }); if (!r.type && w.switchType) r.type = w.switchType; maker(w.manufacturer, 'Switches'); });

}

/* ===================== Step 8.0: private GMK reference catalog =====================
   Data: "Keycaps Info From Matrix" by Matrix Zou, CC BY-NC-ND 4.0, personal private use only.
   It is NOT in this file or the GitHub repo: it is loaded from gmk_catalog_private.json on the Import page into
   keyboard_collection/main/gmk_catalog (readable only when signed in). Reference only: it never changes your items. */
const GMK_CREDIT = 'GMK set data from "Keycaps Info From Matrix" by Matrix Zou (CC BY-NC-ND 4.0). Personal, private use only. Colors are screen approximations.';

function loadGmk(force = false) {   // read once per visit, then reuse
  if (!db || isFile) return Promise.resolve([]);

  if (gmkLoading && !force) return gmkLoading;
  gmkLoading = Promise.all([gmkCol().get(), gmkMetaRef().get()]).then(([snap, m]) => {
    gmkSets = snap.docs.map(d => Object.assign({}, d.data(), { id: d.id })).sort((a, b) => a.title.localeCompare(b.title, 'en', { sensitivity: 'base' }));

}
function gmkCodeLabel(c) { return c ? (c.sys === 'GMK' || c.sys === 'Hex' ? c.code : c.sys + ' ' + c.code) : ''; }
function gmkKitPrice(k) { if (k.priceUsd != null) return money(k.priceUsd); const e = Object.entries(k.prices || {})[0]; return e ? `${money(e[1])} (${esc(e[0])})` : ''; }
function gmkStripHtml(set) {
  const seen = new Set(), sw = [];
  (set.colors || []).flatMap(r => [r.base, r.legend]).forEach(c => { const h = gmkHex(c); if (h && !seen.has(h)) { seen.add(h); sw.push([gmkCodeLabel(c), h]); } });
  return sw.length ? `<span class="pstrip">${sw.map(([c, h]) => `<i style="background:${h}" title="${esc(c)} ${h}"></i>`).join('')}</span>` : '';
}
let gmkImport = null;
function drawGmkImportPreview() {
  const box = document.getElementById('impPreview'); if (!box || !gmkImport) return;
  const have = gmkSets ? gmkSets.length : null;
  box.innerHTML = `<div class="card"><h3>Private GMK reference catalog</h3>
    <p class="sub">${gmkImport.count} sets · ${gmkImport.gmk_catalog.reduce((n, s) => n + (s.kits || []).length, 0)} kits · ${gmkImport.gmk_catalog.filter(s => (s.colors || []).length).length} with color tables · ${Object.keys(gmkImport.standardColors || {}).length} GMK standard colors.
      ${have != null ? `Firebase has ${have} sets now; loading again replaces them.` : ''}</p>
    <div class="note">${esc(gmkImport.credit)} It goes into your locked Firebase only and never changes your own keycap sets. Keep the file on your PC; never upload it to the GitHub repo.</div>
    <div class="btnrow" style="margin-top:12px"><button class="btn primary" id="gmkGo">Load ${gmkImport.count} GMK sets into Firebase</button></div>
    <p class="sub" id="gmkStatus" style="margin:10px 0 0"></p></div>`;
  document.getElementById('gmkGo').onclick = runGmkImport;

async function runGmkImport() {
  const btn = document.getElementById('gmkGo'), st = document.getElementById('gmkStatus');
  if (!confirm(`Load ${gmkImport.count} GMK reference sets into your private Firebase catalog?`)) return;
  btn.disabled = true;
  try {
    const old = await gmkCol().get(), keep = new Set(gmkImport.gmk_catalog.map(s => s.id));
    const ops = gmkImport.gmk_catalog.map(s => b => { const { id, ...rest } = s; b.set(gmkCol().doc(id), rest); })
      .concat(old.docs.filter(d => !keep.has(d.id)).map(d => b => b.delete(gmkCol().doc(d.id))));

async function runImport(rows) {
  const T = importType, btn = document.getElementById('impGo'), st = document.getElementById('impStatus');
  const todo = rows.filter(r => r.status !== 'same');
  if (!confirm(`Import ${todo.length} ${impWord(T, todo.length)} into the app?`)) return;
  btn.disabled = true;
  const now = firebase.firestore.FieldValue.serverTimestamp(), del = firebase.firestore.FieldValue.delete();
  let done = 0;
  try {
    for (let i = 0; i < todo.length; i += 400) {           // Firestore batches hold up to 500 writes
      const batch = db.batch();
      todo.slice(i, i + 400).forEach(r => {
        if (T.nested) {
          const rec = Object.assign(keycapRecord(r), { importKey: r.x.importKey, source: 'excel', importedFrom: importFile.source, importedAt: now, updatedAt: now });
          if (r.cur) batch.update(T.col().doc(r.cur.id), rec);
          else batch.set(T.col().doc(), Object.assign(rec, { createdAt: now, isFavorite: false, appVersion: APP_VERSION }));
          return;
        }
        const rec = {};
        T.fields.forEach(f => { if (r.x[f] !== undefined && r.x[f] !== '' && r.x[f] !== null) rec[f] = r.x[f]; else if (r.cur && r.cur[f] !== undefined) rec[f] = del; });
        Object.assign(rec, { importKey: r.x.importKey, source: 'excel', importedFrom: importFile.source, importedAt: now, updatedAt: now });
        if (r.cur) batch.update(T.col().doc(r.cur.id), rec);
        else batch.set(T.col().doc(), Object.assign(rec, T.extraNew(r.x), { createdAt: now, isFavorite: false, appVersion: APP_VERSION }));
      });
      await withTimeout(batch.commit(), 30000);
      done += Math.min(400, todo.length - i);
      st.textContent = `Imported ${done} of ${todo.length}…`;
    }
    await importMetaRef().set({ [T.metaKey || T.key]: { file: importFile.fileName, source: importFile.source, exportedAt: importFile.exportedAt, count: importFile.count,
      excelTotal: importFile.excelTotal, excelTotalRow: importFile.excelTotalRow ?? null, importedAt: now, ...(importFile.excelTotalLabel ? { excelTotalLabel: importFile.excelTotalLabel } : {}),
      ...(T.nested ? { kitCount: importFile.kitCount, fileTotal: Math.round(importFile[T.key].reduce((t, x) => t + kitsOf(x).reduce((u, k) => u + kbTotal(k), 0), 0) * 100) / 100, formulaMismatches: (importFile.totalMismatches || []).length } : {}) } }, { merge: true });
    const what = impWord(T, done);
    toast(`Imported ${done} ${what}`);
    lastImportMsg = `Done: ${done} ${what} imported at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}. Everything now matches this file.`;
    const st2 = document.getElementById('impStatus'); if (st2) st2.textContent = lastImportMsg;
    drawReconcile();
  } catch (e) { st.textContent = `Stopped after ${done}: ${explain(e)} Run the import again to finish; nothing is duplicated.`; btn.disabled = false; }
}

async function drawReconcile() {
  const box = document.getElementById('reconcile'); if (!box) return;

  let meta = {};

  catch (e) { box.innerHTML = `<div class="card" style="margin-top:16px"><h3>3 · Check against Excel</h3><p class="sub">Could not read the last import: ${esc(explain(e))}</p></div>`; return; }
  if (!document.getElementById('reconcile')) return;
  const parts = Object.values(IMPORT_TYPES).map(T => {
    const m = meta[T.metaKey || T.key];
    if (!m) return `<div class="sec"><h4>${T.title}</h4><p class="sub" style="margin:0">Appears after your first ${T.title.toLowerCase()} import.</p></div>`;
    if (T.nested) return keycapReconcileHtml(T, m);
    const imported = T.saved().filter(k => k.source === 'excel'), appOnly = T.saved().filter(k => k.source !== 'excel');
    const appSum = imported.reduce((s, k) => s + (T.total ? T.total(k) : kbTotal(k)), 0), diff = appSum - (Number(m.excelTotal) || 0);

    const when = m.importedAt && m.importedAt.toDate ? m.importedAt.toDate().toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';
    return `<div class="sec"><h4>${T.title}</h4>
      <p class="sub">Last import: ${esc(m.file || '')} from ${esc(m.source || '')}${when ? ' on ' + esc(when) : ''}.</p>
      <div class="calc" style="grid-template-columns:repeat(4,1fr)">
        <div>${m.excelTotalLabel ? 'Excel total*' : 'Excel TOTAL row'}<b>${money(m.excelTotal)}</b></div><div>App total (imported)<b>${money(appSum)}</b></div>
        <div>Difference<b style="color:${Math.abs(diff) <= 0.05 ? '#86efac' : '#fca5a5'}">${money(diff)}</b></div>
        <div class="tot">Result<b style="color:${ok ? '#86efac' : '#fca5a5'}">${ok ? '✓ Matches' : '✗ Check below'}</b></div></div>
      <p class="sub" style="margin:12px 0 0">${m.count} rows in Excel · ${imported.length} imported in the app${imported.length === m.count ? ' ✓' : ' ✗'}. A match within $0.05 passes.${m.excelTotalLabel ? ` *${esc(m.excelTotalLabel)}.` : ''}</p>
      ${changed.length ? `<div class="note" style="margin-top:12px"><b>Changed in the app since import</b> (update the workbook or re-import):<ul style="margin:6px 0 0;padding-left:18px">${changed.map(k => `<li>${esc((T.who(k) || '') + ' ' + k.name)} (Excel row ${k.excelRow}): app ${money(kbTotal(k))} vs Excel ${money(k.excelTotal)}</li>`).join('')}</ul></div>` : ''}
      ${appOnly.length ? `<div class="note" style="margin-top:12px"><b>Added in the app, not in Excel</b> (not part of the check):<ul style="margin:6px 0 0;padding-left:18px">${appOnly.map(k => `<li>${esc(((T.who(k) || '') + ' ' + k.name).trim())}${k.price != null ? ' · ' + money(kbTotal(k)) : ''}</li>`).join('')}</ul></div>` : ''}
    </div>`;
  });
  box.innerHTML = `<div class="card" style="margin-top:16px"><h3>3 · Check against Excel</h3><p class="sub">Each tab's TOTAL row in the workbook is compared with the app's own math.</p>${parts.join('')}</div>`;
}

  const when = m.importedAt && m.importedAt.toDate ? m.importedAt.toDate().toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '';

    ${changed.length ? `<div class="note" style="margin-top:12px"><b>Changed in the app since import</b> (update the workbook or re-import):<ul style="margin:6px 0 0;padding-left:18px">${changed.map(k => `<li>${esc(k._set + ' — ' + k.name)} (Excel row ${k.excelRow}): app ${money(kbTotal(k))} vs import ${money(k.importedTotal)}</li>`).join('')}</ul></div>` : ''}
    ${appKits.length ? `<div class="note" style="margin-top:12px"><b>Kits added in the app, not in Excel</b> (not part of the check):<ul style="margin:6px 0 0;padding-left:18px">${appKits.map(k => `<li>${esc(k._set + ' — ' + k.name)}${k.price != null ? ' · ' + money(kbTotal(k)) : ''}</li>`).join('')}</ul></div>` : ''}
  </div>`;
}

/* ===================== Protocol check (guardrail: Firestore rejects file://) ===================== */
const isFile = location.protocol === 'file:';
const isInsecure = location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname);
if (isFile || isInsecure) {
  const warn = document.getElementById('protoWarn');
  warn.style.display = 'block';
  warn.innerHTML = isFile
    ? '<strong>Opened from a file on this device.</strong> Sync will not work this way, because Firebase blocks file:// pages. Open <strong>https://fniskeebs69.github.io/keyboards/</strong> instead.'
    : '<strong>Not a secure connection.</strong> Open <strong>https://fniskeebs69.github.io/keyboards/</strong> so sync and installing work.';
}

/* ===================== Sign-in (Google) =====================
   The app opens only after you sign in with Google. Once the Firestore rules are locked to your
   account (Settings → Lock your database), only you can read or write keyboard_collection. */
let auth = null, currentUser = null, listenersOn = false;
function startAllListeners() {
  if (listenersOn) return; listenersOn = true;
  startKeyboardListener(); startSwitchListener(); startKeycapListener(); startPartListeners(); startWishListener();
}
function showSignIn(msg = '') {
  try { const r = localStorage.getItem('kbc_remember'); if (r !== null) document.getElementById('siRemember').checked = r === '1'; } catch {}
  const el = document.getElementById('signin'); el.hidden = false; document.body.classList.add('locked');
  document.getElementById('siMsg').textContent = msg;
  document.getElementById('siBtn').disabled = false; document.getElementById('siBtn').textContent = 'Sign in with Google';
}
function hideSignIn() { document.getElementById('signin').hidden = true; document.body.classList.remove('locked'); }
async function signInGoogle() {
  const btn = document.getElementById('siBtn'), msg = document.getElementById('siMsg');
  const provider = new firebase.auth.GoogleAuthProvider(); provider.setCustomParameters({ prompt: 'select_account' });
  btn.disabled = true; btn.textContent = 'Opening Google…'; msg.textContent = '';
  try {   // unticked "keep me signed in": the sign-in ends when this window or tab is closed
    const keep = document.getElementById('siRemember').checked;
    try { localStorage.setItem('kbc_remember', keep ? '1' : '0'); } catch {}
    const P = firebase.auth.Auth && firebase.auth.Auth.Persistence; if (P) await auth.setPersistence(keep ? P.LOCAL : P.SESSION);
    await auth.signInWithPopup(provider); }
  catch (e) {
    if (['auth/popup-blocked', 'auth/operation-not-supported-in-this-environment'].includes(e.code)) {
      msg.textContent = 'Pop-up was blocked, switching to a full-page sign-in…'; try { await auth.signInWithRedirect(provider); return; } catch (e2) { e = e2; }
    }
    showSignIn(e.code === 'auth/popup-closed-by-user' || e.code === 'auth/cancelled-popup-request' ? 'Sign-in was closed before it finished.'
      : e.code === 'auth/unauthorized-domain' ? 'This web address is not on the Firebase authorized domains list.' : 'Could not sign in: ' + (e.code || e.message));
  }
}
async function signOutApp() {
  if (!confirm('Sign out of Keyboard Collection on this device?')) return;
  try { await auth.signOut(); } catch (e) { toast('Could not sign out: ' + (e.code || e.message)); return; }
  location.hash = '#/dashboard'; location.reload();
}
function lockedRulesText(uid) {
  return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    // Keycap Collection app (keycaps/): unchanged, still open
    match /keycap_tracker/{doc} {
      allow read, write: if true;
    }
    // Keyboard Collection app (keyboards/): only Faraz's Google account
    match /keyboard_collection/{document=**} {
      allow read, write: if request.auth != null && request.auth.uid == "${uid}";
    }
  }
}`;
}

/* ===================== Firebase init ===================== */
const fbDot = document.getElementById('fbDot'), fbText = document.getElementById('fbText');
let db = null;
try {
  if (typeof firebase === 'undefined') throw new Error('SDK did not load (offline?)');
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  if (isFile) { fbDot.className = 'dot bad'; fbText.textContent = 'Sync blocked (file://)'; }
  else { fbDot.className = 'dot ok'; fbText.textContent = 'Firebase ready'; }
} catch (err) { console.error(err); fbDot.className = 'dot bad'; fbText.textContent = 'Firebase not loaded'; }
document.getElementById('verText').textContent = APP_VERSION;
if (db && !isFile) {
  try {
    if (typeof firebase.auth !== 'function') throw new Error('Sign-in did not load (offline?)');
    auth = firebase.auth();
    showSignIn(''); document.getElementById('siBtn').disabled = true; document.getElementById('siBtn').textContent = 'Checking sign-in…';
    auth.getRedirectResult().catch(e => showSignIn('Could not sign in: ' + (e.code || e.message)));
    auth.onAuthStateChanged(u => {
      currentUser = u;
      if (u) { hideSignIn(); document.getElementById('userText').textContent = u.email || u.displayName || 'Signed in'; document.getElementById('userRow').hidden = false; startAllListeners(); route(); }
      else { document.getElementById('userRow').hidden = true; showSignIn(document.getElementById('siMsg').textContent); }
    });
  } catch (err) { console.error(err); fbDot.className = 'dot bad'; fbText.textContent = 'Sign-in not loaded'; showSignIn(String(err.message || err)); }
} else { startAllListeners(); route(); }
</script>
