<style>
  :root {
    --bg: #0f1115; --bg-2: #13161c; --side: #12151b;
    --surface: #181c24; --surface-2: #20252f; --line: #282e3a; --line-2: #323949;
    --text: #e9ebf0; --text-2: #a3a9b8; --text-3: #6d7486;
    --kb: #f5a524; --sw: #fb7185; --kc: #2dd4bf; --pcb: #4ade80; --ac: #a78bfa; --ar: #38bdf8; --neutral: #f5a524;
    --accent: var(--kb);
    --radius: 14px;
    --side-w: 236px;
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; font-size: 14px; }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; background: linear-gradient(to right, var(--side) var(--side-w), var(--bg) var(--side-w)); }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); border-right: 1px solid var(--line);
    padding: calc(16px + var(--safe-top)) 12px 16px; display: flex; flex-direction: column; }
  .brandmark { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; }
  .brandmark .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: color-mix(in srgb, var(--kb) 16%, transparent); color: var(--kb); }
  .brandmark .logo svg { width: 20px; height: 20px; }
  .brandmark b { display: block; font-size: 15px; letter-spacing: -.01em; }
  .brandmark span { display: block; font-size: 11.5px; color: var(--text-3); }
  .navgroup { margin: 10px 0 4px; padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--text-3); }
  .navitem { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: 9px; text-decoration: none; color: var(--text-2);
    font-weight: 550; margin: 1px 0; border: 1px solid transparent; }
  .navitem svg { width: 18px; height: 18px; color: var(--c, var(--text-3)); flex: none; }
  .navitem:hover { background: var(--surface); color: var(--text); }
  .navitem.on { background: color-mix(in srgb, var(--c, var(--kb)) 12%, var(--surface)); color: var(--text);
    border-color: color-mix(in srgb, var(--c, var(--kb)) 30%, transparent); }
  .navitem .soon { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--text-3); border: 1px solid var(--line); border-radius: 6px; padding: 1px 5px; }
  .side-foot { margin-top: auto; padding: 14px 10px 0; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--text-3); display: grid; gap: 6px; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .dot.ok { background: #34d399; } .dot.bad { background: #f87171; }

  .main { min-width: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: calc(26px + var(--safe-top)) 32px 48px; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .pagehead h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .pagehead p { margin: 4px 0 0; color: var(--text-2); }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  #protoWarn { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: 12px; background: #3a1d22; border: 1px solid #7a2e3a; color: #ffd7dc; line-height: 1.45; }
  #protoWarn strong { color: #fff; }

  /* ---------- Controls ---------- */
  .btn { border: 1px solid var(--line-2); background: var(--surface-2); border-radius: 10px; padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #14110a; }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.danger:hover:not(:disabled) { border-color: #f87171; color: #fecaca; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }
  .select, .input { background: var(--surface); border: 1px solid var(--line-2); border-radius: 10px; padding: 8px 12px; outline: none; }
  .select:focus, .input:focus { border-color: var(--accent); }
  .seg { display: inline-flex; border: 1px solid var(--line-2); border-radius: 10px; overflow: hidden; }
  .seg button { background: var(--surface); border: 0; padding: 8px 12px; cursor: pointer; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
  .seg button + button { border-left: 1px solid var(--line-2); }
  .seg button.on { background: var(--surface-2); color: var(--accent); font-weight: 650; }
  .seg svg { width: 15px; height: 15px; }
  .search { position: relative; flex: 1; min-width: 260px; }
  .search input { width: 100%; padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-3); }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: 6px; background: var(--surface-2); border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  .chip.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .sub { margin: 0 0 14px; color: var(--text-2); font-size: 13px; line-height: 1.5; }
  .note { font-size: 12.5px; color: var(--text-2); border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--line));
    background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: 10px; padding: 9px 12px; margin-bottom: 16px; }

  /* ---------- Dashboard ---------- */
  .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .tile { display: flex; gap: 16px; align-items: flex-start; text-decoration: none; position: relative; }
  .tile .ic { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .tile .ic svg { width: 24px; height: 24px; }
  .tile .lbl { color: var(--text-2); font-size: 14px; }
  .tile .big { font-size: 34px; font-weight: 750; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--text-3); font-size: 12.5px; }
  .tile .hint.good { color: #34d399; }
  .tile .eye { position: absolute; right: 14px; top: 14px; }
  .tile .blur { filter: blur(9px); user-select: none; }

function money(n) {

function fmtDate(iso) { // 'YYYY-MM-DD' read as a local date, so it never shifts a day
  if (!iso) return '';
  const [y, m, d] = iso.split('-').map(Number);

function kbTotal(k) { // Excel formula: Price x (1 + Tax Rate) + Shipping - Discounts
  return (Number(k.price) || 0) * (1 + (Number(k.taxRate) || 0)) + (Number(k.shipping) || 0) - (Number(k.discounts) || 0);
}
/* Saved keyboards come live from Firestore: keyboard_collection/main/keyboards/<id> */
let savedKeyboards = [];      // filled by the live listener
let kbLoaded = false;         // true after the first server answer
function kbCol() { return db.collection(FIRESTORE_COLLECTION).doc(ROOT_DOC).collection('keyboards'); }
function isoFromTs(ts) { if (!ts || !ts.toDate) return ''; const d = ts.toDate(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }
function startKeyboardListener() {
  if (!db || isFile) return;
  kbCol().onSnapshot(snap => {
    savedKeyboards = snap.docs.filter(d => d.id !== TEST_DOC_ID && !d.data().isTest).map(d => {
      const k = d.data();
      return Object.assign({}, k, { id: d.id, isSample: false, createdIso: isoFromTs(k.createdAt) });
    });
    kbLoaded = true;
    refreshIfShowing();
  }, err => { console.error(err); toast('Could not load keyboards: ' + explain(err)); });
}
function refreshIfShowing() {
  const id = (location.hash.replace(/^#\/?/, '').split('/')[0]) || 'dashboard';
  if (id === 'dashboard') route();
  else if (id === 'keyboards' && document.getElementById('kbResults')) drawKeyboardResults();
  else if (id === 'keyboards' && document.getElementById('kbDetailFor')) route();
}
/* Samples stay visible (marked "Sample") until the Excel import in Phase 3. */
function allKeyboards() { return savedKeyboards.concat(SAMPLE_KEYBOARDS); }
function sortDate(k) { return k.datePurchased || k.createdIso || ''; }

/* ===================== Router ===================== */
let currentView = '';
function route() {
  stopTestListener();
  const parts = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean);
  if (parts[0] === 'connection-test') { location.replace('#/settings'); return; } // old v0.2.0 link
  const id = parts[0] || 'dashboard';
  const sec = SEC[id] || SEC.dashboard;
  document.documentElement.style.setProperty('--accent', sec.color.startsWith('var(--text') ? 'var(--kb)' : sec.color);
  renderNav(sec.id);
  document.title = sec.title + ' · Keyboard Collection';
  const view = document.getElementById('view');
  if (sec.id === 'dashboard') view.innerHTML = dashboardHtml(), wireDashboard();
  else if (sec.id === 'keyboards' && parts[1] === 'new') renderKeyboardForm();
  else if (sec.id === 'keyboards' && parts[1]) renderKeyboardDetail(parts[1]);
  else if (sec.id === 'keyboards') renderKeyboards();
  else if (sec.id === 'settings') renderSettings();
  else view.innerHTML = comingLaterHtml(sec);
  if (currentView !== location.hash) window.scrollTo(0, 0);
  currentView = location.hash;
}
window.addEventListener('hashchange', () => {
  if (formDirty && !location.hash.startsWith('#/keyboards/new')) {
    if (!confirm('Discard the keyboard you were adding?')) { history.replaceState(null, '', '#/keyboards/new'); return; }
    formDirty = false;
  }
  route();
});
window.addEventListener('beforeunload', e => { if (formDirty) { e.preventDefault(); e.returnValue = ''; } });

}

/* ===================== Dashboard ===================== */
let spendPeriod = 'all', spendHidden = true;
const PERIODS = { all: 'All time', '1m': 'Last month', '3m': '3 months', '6m': '6 months', '1y': 'Last year' };
function spendFor(period) {
  const now = new Date(); let from = null;
  const months = { '1m': 1, '3m': 3, '6m': 6, '1y': 12 }[period];
  if (months) { from = new Date(now); from.setMonth(from.getMonth() - months); }
  return allKeyboards().filter(k => {
    if (!from) return true;
    const [y, m, d] = (k.datePurchased || '').split('-').map(Number);
    return y && new Date(y, m - 1, d) >= from;
  }).reduce((s, k) => s + kbTotal(k), 0);
}

      <div class="hint" style="margin-top:6px">${spendHidden ? 'Amount hidden.' : 'Price + tax + shipping − discounts.'}</div></div>
      <button class="btn eye" id="spendEye" aria-label="${spendHidden ? 'Show' : 'Hide'} amount">${I.eye}</button></div>
    ${comingTile('Boards in use', I.pulse, '#34d399', 'Step 5.4')}

    <div class="addrow">${SECTIONS.filter(s => s.singular).map(s => s.id === 'keyboards'

    <p class="sub" style="margin:10px 0 0">The other types follow page by page.</p></div>

    <div class="recent" style="margin-top:10px">${recent.map(k => `<a href="#/keyboards/${esc(k.id)}" style="--c:var(--kb)"><span class="th">${I.keyboards}</span><div><b>${esc(k.name)}</b><span>${esc(k.brand)}</span></div></a>`).join('')}</div></div>

function wireDashboard() {
  document.getElementById('spendPeriod').onchange = e => { spendPeriod = e.target.value; route(); };

/* ===================== Keyboards: gallery / list ===================== */
const SORTS = { newest: 'Newest first', oldest: 'Oldest first', nameAZ: 'Name A→Z', nameZA: 'Name Z→A', brandAZ: 'Brand A→Z', brandZA: 'Brand Z→A' };
let kbSort = 'newest', kbView = 'gallery', kbQuery = '';
function sortKeyboards(list) {
  const by = (f, dir) => (a, b) => dir * String(f(a) || '').localeCompare(String(f(b) || ''), 'en', { sensitivity: 'base' });
  const s = { newest: by(sortDate, -1), oldest: by(sortDate, 1), nameAZ: by(k => k.name, 1), nameZA: by(k => k.name, -1), brandAZ: by(k => k.brand, 1), brandZA: by(k => k.brand, -1) }[kbSort];
  return [...list].sort(s);
}
function isFav(k) { return k.isSample ? favs.has(k.id) : !!k.isFavorite; }
async function toggleFav(id) {
  const k = allKeyboards().find(x => x.id === id); if (!k) return;
  if (k.isSample) { favs.has(id) ? favs.delete(id) : favs.add(id); drawKeyboardResults(); return; }
  try { await kbCol().doc(id).update({ isFavorite: !k.isFavorite, updatedAt: firebase.firestore.FieldValue.serverTimestamp() }); }
  catch (e) { toast('Could not update favorite: ' + explain(e)); }
}
function matches(k, q) {
  if (!q) return true;
  const hay = [k.brand, k.name, k.color, k.size, k.connectivity, k.mods, k.currentBuildText, k.purchasedFrom, k.manufacturer, k.designer, k.location, k.status, k.layout]
    .concat(BUILD_FIELDS.map(f => k[f[0]])).join(' ').toLowerCase();
  return q.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function renderKeyboards() {
  const view = document.getElementById('view');
  view.innerHTML = `
    <div class="pagehead"><div><h1>Keyboards</h1><p id="kbCount"></p></div>
      <div class="tools">
        <select class="select" id="kbSort" aria-label="Sort">${Object.entries(SORTS).map(([v, t]) => `<option value="${v}"${v === kbSort ? ' selected' : ''}>${t}</option>`).join('')}</select>
        <div class="seg" role="group" aria-label="View"><button id="vGal" class="${kbView === 'gallery' ? 'on' : ''}">${I.grid}Gallery</button><button id="vList" class="${kbView === 'list' ? 'on' : ''}">${I.list}List</button></div>
        <a class="btn primary" href="#/keyboards/new">${I.plus}Add keyboard</a>
      </div></div>
    <div class="tools" style="margin-bottom:16px"><label class="search">${I.search}<input class="input" id="kbSearch" placeholder="Search by brand, name, color, size, build parts or mods" value="${esc(kbQuery)}"></label></div>
    <div class="note">Cards marked "Sample" are 5 boards from your v18 workbook, shown in the app only. Keyboards you add are saved to Firebase and sync to all your devices.</div>
    <div id="kbResults"></div>`;
  document.getElementById('kbSort').onchange = e => { kbSort = e.target.value; drawKeyboardResults(); };
  document.getElementById('vGal').onclick = () => { kbView = 'gallery'; renderKeyboards(); };
  document.getElementById('vList').onclick = () => { kbView = 'list'; renderKeyboards(); };
  document.getElementById('kbSearch').oninput = e => { kbQuery = e.target.value; drawKeyboardResults(); };
  drawKeyboardResults();
}
function drawKeyboardResults() {
  const all = allKeyboards();
  const list = sortKeyboards(all.filter(k => matches(k, kbQuery.trim())));
  const nSaved = savedKeyboards.length;
  document.getElementById('kbCount').textContent = (kbQuery.trim() ? `${list.length} of ${all.length} keyboards` : `${all.length} keyboards`) + ` · ${nSaved} saved, ${SAMPLE_KEYBOARDS.length} samples` + (db && !isFile && !kbLoaded ? ' · loading…' : '');
  const box = document.getElementById('kbResults');
  if (!list.length) { box.innerHTML = `<div class="card empty"><div class="big">${I.search}</div><h2>No matches</h2><p>Nothing matches "${esc(kbQuery)}".</p></div>`; return; }
  if (kbView === 'gallery') {
    box.innerHTML = `<div class="gallery">${list.map(k => `
      <a class="kcard" href="#/keyboards/${esc(k.id)}">
        <div class="ph">${I.keyboards.replace('<svg', '<svg class="big"')}<span class="nophoto">No photo yet</span>
          ${k.isSample ? '<span class="badge chip">Sample</span>' : ''}
          <button class="fav${isFav(k) ? ' on' : ''}" data-fav="${esc(k.id)}" aria-label="${isFav(k) ? 'Remove from' : 'Add to'} favorites">${isFav(k) ? I.starFill : I.star}</button></div>
        <div class="meta"><b>${esc(k.name)}</b><span>${esc(k.brand)}</span></div>
      </a>`).join('')}</div>`;
  } else {
    box.innerHTML = `<table class="list"><thead><tr><th style="width:44px"></th><th>Name</th><th>Brand</th><th>Size</th><th>Color</th><th>Purchased</th></tr></thead><tbody>${list.map(k => `
      <tr class="row" data-href="#/keyboards/${esc(k.id)}"><td><button class="fav${isFav(k) ? ' on' : ''}" style="position:static;width:28px;height:28px" data-fav="${esc(k.id)}" aria-label="Favorite">${isFav(k) ? I.starFill : I.star}</button></td>
      <td><b>${esc(k.name)}</b></td><td>${esc(k.brand)}</td><td>${esc(k.size)}</td><td>${esc(k.color)}</td><td>${esc(fmtDate(k.datePurchased)) || '<span style="color:var(--text-3)">—</span>'}</td></tr>`).join('')}</tbody></table>`;
  }
  box.onclick = e => {
    const f = e.target.closest('[data-fav]');
    if (f) { e.preventDefault(); e.stopPropagation(); toggleFav(f.dataset.fav); return; }
    const r = e.target.closest('tr[data-href]'); if (r) location.hash = r.dataset.href;
  };
}

function linkOrText(url, text, fallbackLabel = 'Open link') {
  if (url && /^https?:\/\//.test(url)) {

    return `<a class="lnk" href="${esc(url)}" target="_blank" rel="noopener">${esc(label)}</a>`;
  }
  if (text && /^[A-Za-z]:\\/.test(text)) return esc('File on your PC: ' + text.split('\\').pop());
  return text ? esc(text) : '';
}

function num(id) { const v = document.getElementById(id)?.value; return v === '' || v == null ? 0 : Number(v); }
function updateCalc() {
  const k = { price: num('f_price'), taxRate: num('f_taxRatePct') / 100, shipping: num('f_shipping'), discounts: num('f_discounts') };

  document.getElementById('cTotal').textContent = money(kbTotal(k));
}
function tabOf(name) { return ['datePurchased', 'dateReceived', 'purchasedFrom', 'price', 'taxRatePct', 'shipping', 'discounts', 'receipt', 'pictureLink'].includes(name) ? 'purchase' : 'overview'; }
function clearFieldError(name) {
  const f = document.querySelector(`.fld[data-for="${name}"]`); if (!f) return;
  f.classList.remove('bad'); const m = f.querySelector('.msg'); if (m) m.remove();
  const tab = tabOf(name);
  if (!document.querySelector(`[data-panel="${tab}"] .fld.bad`)) document.getElementById(tab === 'purchase' ? 'errPurchase' : 'errOverview').textContent = '';
}
function showFieldError(name, msg, focus = true) {
  const f = document.querySelector(`.fld[data-for="${name}"]`);
  f.classList.add('bad'); if (!f.querySelector('.msg')) f.insertAdjacentHTML('beforeend', `<div class="msg">${esc(msg)}</div>`);
  const tab = tabOf(name);
  document.getElementById(tab === 'purchase' ? 'errPurchase' : 'errOverview').textContent = '· contains errors';
  if (focus) { document.querySelector(`.tabs [data-tab="${tab}"]`).click(); document.getElementById('f_' + name).focus(); }
}
function readKeyboardForm() {
  const v = n => (document.getElementById('f_' + n)?.value || '').trim();
  const data = { keyboardType: v('keyboardType') || 'custom' };
  ['brand', 'name', 'manufacturer', 'size', 'location', 'modelNumber', 'serialNumber', 'designer', 'layout', 'color', 'connectivity', 'connector', 'status', 'typingAngle', 'frontHeight', 'weight', 'currentBuildText']
    .concat(BUILD_FIELDS.map(f => f[0]))
    .forEach(n => { const x = v(n); if (x) data[n] = x; });
  data.isFavorite = document.getElementById('f_isFavorite').checked;
  ['datePurchased', 'dateReceived', 'purchasedFrom', 'receipt', 'pictureLink'].forEach(n => { const x = v(n); if (x) data[n] = x; });
  const n = id => { const x = v(id); return x === '' ? null : Number(x); };
  const price = n('price'), tax = n('taxRatePct'), ship = n('shipping'), disc = n('discounts');
  data._numbers = { price, taxRatePct: tax, shipping: ship, discounts: disc };
  if (price !== null) data.price = Math.round(price * 100) / 100;
  if (tax !== null) data.taxRate = Math.round(tax * 1e6) / 1e8;  // stored as a fraction like Excel (6.625% -> 0.06625)
  if (ship !== null) data.shipping = Math.round(ship * 100) / 100;
  if (disc !== null) data.discounts = Math.round(disc * 100) / 100;
  const acq = [...document.querySelectorAll('input[name="acq"]:checked')].map(c => c.value);
  if (acq.length) data.acquisition = acq;
  return data;
}
async function saveKeyboard() {
  const btn = document.getElementById('btnSave'), errBox = document.getElementById('formErr');
  errBox.style.display = 'none';
  const data = readKeyboardForm();
  const nums = data._numbers; delete data._numbers;
  const problems = [];
  ['price', 'shipping', 'discounts'].forEach(k => { if (nums[k] !== null && (!isFinite(nums[k]) || nums[k] < 0)) problems.push([k, 'Enter an amount of 0 or more']); });
  if (nums.taxRatePct !== null && (!isFinite(nums.taxRatePct) || nums.taxRatePct < 0 || nums.taxRatePct > 30)) problems.push(['taxRatePct', 'Enter a percent between 0 and 30']);
  if (data.datePurchased && data.dateReceived && data.dateReceived < data.datePurchased) problems.push(['dateReceived', 'Received date is before the purchase date']);
  if (!data.name) problems.unshift(['name', 'Name is required']);
  if (problems.length) { problems.forEach(([f, m], i) => showFieldError(f, m, i === 0)); return; }
  btn.disabled = true; btn.textContent = 'Saving…';
  try {
    const now = firebase.firestore.FieldValue.serverTimestamp();
    const ref = await withTimeout(kbCol().add(Object.assign(data, { createdAt: now, updatedAt: now, appVersion: APP_VERSION, source: 'app' })));
    formDirty = false;
    toast(`Saved "${data.name}"`);
    location.hash = '#/keyboards/' + ref.id;
  } catch (e) {
    errBox.style.display = 'block'; errBox.textContent = 'Could not save: ' + explain(e) + ' Your entries are still here; try again.';
    btn.disabled = false; btn.textContent = 'Save keyboard';
  }
}

let testUnsub = null;
function stopTestListener() { if (testUnsub) { testUnsub(); testUnsub = null; } }
function testRef() { return db.collection(FIRESTORE_COLLECTION).doc(ROOT_DOC).collection('keyboards').doc(TEST_DOC_ID); }
function deviceLabel() {
  const ua = navigator.userAgent;
  const os = /Windows/.test(ua) ? 'Windows' : /Android/.test(ua) ? 'Android' : /iPhone|iPad/.test(ua) ? 'iOS' : /Mac/.test(ua) ? 'Mac' : /Linux/.test(ua) ? 'Linux' : 'Other';
  const br = /Edg\//.test(ua) ? 'Edge' : /Chrome\//.test(ua) ? 'Chrome' : /Firefox\//.test(ua) ? 'Firefox' : /Safari\//.test(ua) ? 'Safari' : 'Browser';
  const app = window.matchMedia('(display-mode: standalone)').matches ? 'installed app' : 'browser tab';
  return `${br} on ${os} (${app})`;
}
function logLine(msg, kind) {
  const ul = document.getElementById('testLog'); if (!ul) return;
  const li = document.createElement('li'); if (kind) li.className = kind;
  li.innerHTML = `<span>${new Date().toLocaleTimeString()}</span>${esc(msg)}`;
  ul.prepend(li);
}
function explain(err) {
  if (err && err.code === 'permission-denied') return 'Permission denied. Check that the Firestore rules include the keyboard_collection block and were published.';
  if (err && err.code === 'unavailable') return 'Firebase is unreachable (offline?).';
  if (err && err.code === 'timeout') return err.message + '.';
  return (err && (err.code || err.message)) || String(err);
}
function fmtTime(ts) { if (!ts) return 'pending…'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString(); }
function renderSettings() {
  const ready = !!db && !isFile;
  document.getElementById('view').innerHTML = `
    <div class="pagehead"><div><h1>Settings</h1><p>App information and tools.</p></div></div>
    <div class="two">
      <div class="card"><h3>About this app</h3><p class="sub">Keyboard Collection ${APP_VERSION} · single user · USD</p>
        <div class="kv">Data path: ${FIRESTORE_COLLECTION}/${ROOT_DOC}/&lt;type&gt;/&lt;id&gt;<br>Firebase project: ${firebaseConfig.projectId}</div></div>
      <div class="card"><h3>Photo storage</h3><p class="sub">A storage meter appears here once photos arrive (Step 2.7), so you can see the free limit coming.</p></div>
    </div>
    <h2 style="font-size:17px;margin:26px 0 12px">Connection test</h2>
    <div class="two">
      <div class="card"><h3>Test record, live</h3><p class="sub">Updates by itself when the record changes on any device.</p>
        <div class="live"><span class="dot" id="liveDot"></span><div><b id="liveTitle">Connecting…</b><div class="kv" id="liveInfo"></div></div></div></div>
      <div class="card"><h3>Actions</h3><p class="sub">Write one dummy keyboard, read it back from the server, then delete it. Open this page on a second device to watch it sync.</p>
        <div class="btnrow">
          <button class="btn primary" id="btnWrite" ${ready ? '' : 'disabled'}>Write test keyboard</button>
          <button class="btn" id="btnRead" ${ready ? '' : 'disabled'}>Read from server</button>
          <button class="btn danger" id="btnDelete" ${ready ? '' : 'disabled'}>Delete test keyboard</button></div>
        <ul class="log" id="testLog" style="margin-top:14px"></ul></div>
    </div>`;
  if (!ready) {
    document.getElementById('liveDot').className = 'dot bad';
    document.getElementById('liveTitle').textContent = isFile ? 'Blocked: opened from a file' : 'Firebase not loaded';
    return;
  }
  testUnsub = testRef().onSnapshot(snap => {
    const dot = document.getElementById('liveDot'); if (!dot) return;
    if (snap.exists) {
      const d = snap.data(); dot.className = 'dot ok';
      document.getElementById('liveTitle').textContent = 'Test record exists';
      document.getElementById('liveInfo').innerHTML = `name: ${esc(d.name)}<br>written by: ${esc(d.writtenBy)}<br>written at: ${esc(fmtTime(d.createdAt))}<br>from server: ${snap.metadata.fromCache ? 'not yet (local copy)' : 'yes'}`;
    } else {
      dot.className = 'dot';
      document.getElementById('liveTitle').textContent = 'No test record';
      document.getElementById('liveInfo').textContent = snap.metadata.fromCache ? '(checking server…)' : 'Server confirms it is not there.';
    }
  }, err => { const t = document.getElementById('liveTitle'); if (t) t.textContent = 'Listener error'; logLine('Live listener: ' + explain(err), 'err'); });
  document.getElementById('btnWrite').onclick = async () => {
    try { await testRef().set({ name: 'Connection Test Board', brand: 'TEST', isTest: true, writtenBy: deviceLabel(), appVersion: APP_VERSION, createdAt: firebase.firestore.FieldValue.serverTimestamp() });
      logLine('Write OK: test keyboard saved to the server.', 'ok'); } catch (e) { logLine('Write failed: ' + explain(e), 'err'); }
  };
  document.getElementById('btnRead').onclick = async () => {
    try { const snap = await testRef().get({ source: 'server' });
      logLine(snap.exists ? 'Read OK: server has "' + snap.data().name + '" written by ' + snap.data().writtenBy + '.' : 'Read OK: server has no test record.', 'ok'); } catch (e) { logLine('Read failed: ' + explain(e), 'err'); }
  };
  document.getElementById('btnDelete').onclick = async () => {
    try { await testRef().delete(); logLine('Delete OK: test keyboard removed from the server.', 'ok'); } catch (e) { logLine('Delete failed: ' + explain(e), 'err'); }
  };
}

/* ===================== Protocol check (guardrail: Firestore rejects file://) ===================== */
const isFile = location.protocol === 'file:';
const isInsecure = location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname);
if (isFile || isInsecure) {
  const warn = document.getElementById('protoWarn');
  warn.style.display = 'block';
  warn.innerHTML = isFile
    ? '<strong>Opened from a file on this device.</strong> Sync will not work this way, because Firebase blocks file:// pages. Open <strong>https://fniskeebs69.github.io/keyboards/</strong> instead.'
    : '<strong>Not a secure connection.</strong> Open <strong>https://fniskeebs69.github.io/keyboards/</strong> so sync and installing work.';
}

/* ===================== Firebase init ===================== */
const fbDot = document.getElementById('fbDot'), fbText = document.getElementById('fbText');
let db = null;
try {
  if (typeof firebase === 'undefined') throw new Error('SDK did not load (offline?)');
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  if (isFile) { fbDot.className = 'dot bad'; fbText.textContent = 'Sync blocked (file://)'; }
  else { fbDot.className = 'dot ok'; fbText.textContent = 'Firebase ready'; }
} catch (err) { console.error(err); fbDot.className = 'dot bad'; fbText.textContent = 'Firebase not loaded'; }
document.getElementById('verText').textContent = APP_VERSION;
startKeyboardListener();

route();
</script>
</body>
</html>
