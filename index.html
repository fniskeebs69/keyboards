<style>
  :root {
    --bg: #0f1115; --bg-2: #13161c; --side: #12151b;
    --surface: #181c24; --surface-2: #20252f; --line: #282e3a; --line-2: #323949;
    --text: #e9ebf0; --text-2: #a3a9b8; --text-3: #6d7486;
    --kb: #f5a524; --sw: #fb7185; --kc: #2dd4bf; --pcb: #4ade80; --ac: #a78bfa; --ar: #38bdf8; --neutral: #f5a524;
    --accent: var(--kb);
    --radius: 14px; --radius-s: 10px; --radius-xs: 6px; --bw: 1px; --bs: solid; --fs: 14px; --pad: 18px;
    --font: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --ch1: #3987e5; --ch2: #d95926;
    --ok: #34d399; --ok-text: #86efac; --ok-bg: #065f46; --ok-on: #d1fae5; --bad: #f87171; --bad-text: #fca5a5; --warn: #fbbf24;
    --danger-bg: #3a1d22; --danger-line: #7a2e3a; --danger-text: #ffd7dc; --on-accent: #14110a; --well: #0b0d10; --shadow: #000; --swatch-line: rgba(255,255,255,.18);
    --side-w: 236px;
    --safe-top: env(safe-area-inset-top, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--bg); color: var(--text);
    font-family: var(--font);
    -webkit-font-smoothing: antialiased; font-size: var(--fs); }
  button, input, select, textarea { font: inherit; color: inherit; }
  a { color: inherit; }

  /* ---------- Shell ---------- */
  .shell { display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 100vh; background: linear-gradient(to right, var(--side) var(--side-w), var(--bg) var(--side-w)); }
  .side { position: sticky; top: 0; height: 100vh; overflow-y: auto; background: var(--side); border-right: var(--bw) var(--bs) var(--line);
    padding: calc(16px + var(--safe-top)) 12px 16px; display: flex; flex-direction: column; }
  .brandmark { display: flex; align-items: center; gap: 10px; padding: 4px 8px 18px; text-decoration: none; }
  .brandmark .logo { width: 34px; height: 34px; border-radius: var(--radius-s); display: grid; place-items: center; background: color-mix(in srgb, var(--kb) 16%, transparent); color: var(--kb); }
  .brandmark .logo svg { width: 20px; height: 20px; }
  .brandmark b { display: block; font-size: 15px; letter-spacing: -.01em; }
  .brandmark span { display: block; font-size: 11.5px; color: var(--text-3); }
  .navgroup { margin: 10px 0 4px; padding: 0 10px; font-size: 11px; font-weight: 700; letter-spacing: .12em; color: var(--text-3); }
  .navitem { display: flex; align-items: center; gap: 11px; padding: 8px 10px; border-radius: var(--radius-s); text-decoration: none; color: var(--text-2);
    font-weight: 550; margin: 1px 0; border: 1px solid transparent; }
  .navitem svg { width: 18px; height: 18px; color: var(--c, var(--text-3)); flex: none; }
  .navitem:hover { background: var(--surface); color: var(--text); }
  .navitem.on { background: color-mix(in srgb, var(--c, var(--kb)) 12%, var(--surface)); color: var(--text);
    border-color: color-mix(in srgb, var(--c, var(--kb)) 30%, transparent); }
  .navitem .soon { margin-left: auto; font-size: 10px; font-weight: 600; color: var(--text-3); border: var(--bw) var(--bs) var(--line); border-radius: var(--radius-xs); padding: 1px 5px; }
  .side-foot { margin-top: auto; padding: 14px 10px 0; border-top: var(--bw) var(--bs) var(--line); font-size: 11.5px; color: var(--text-3); display: grid; gap: 6px; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); flex: none; }
  .dot.ok { background: var(--ok); } .dot.bad { background: var(--bad); } .dot.warn { background: var(--warn); }

  .main { min-width: 0; }
  .page { max-width: 1240px; margin: 0 auto; padding: calc(26px + var(--safe-top)) 32px 48px; }
  .pagehead { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 20px; }
  .pagehead h1 { margin: 0; font-size: 26px; letter-spacing: -.02em; }
  .pagehead p { margin: 4px 0 0; color: var(--text-2); }
  .tools { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

  #protoWarn { display: none; margin: 0 0 18px; padding: 12px 14px; border-radius: var(--radius-s); background: var(--danger-bg); border: 1px solid var(--danger-line); color: var(--danger-text); line-height: 1.45; }
  #protoWarn strong { color: var(--text); }

  /* ---------- Controls ---------- */
  .btn { border: var(--bw) var(--bs) var(--line-2); background: var(--surface-2); border-radius: var(--radius-s); padding: 8px 14px; font-weight: 600; cursor: pointer; display: inline-flex; align-items: center; gap: 8px; text-decoration: none; }
  .btn:hover:not(:disabled) { border-color: var(--accent); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
  .btn.danger:hover:not(:disabled) { border-color: var(--bad); color: var(--bad-text); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn svg { width: 16px; height: 16px; }
  .select, .input { background: var(--surface); border: var(--bw) var(--bs) var(--line-2); border-radius: var(--radius-s); padding: 8px 12px; outline: none; }
  .select:focus, .input:focus { border-color: var(--accent); }
  .seg { display: inline-flex; border: var(--bw) var(--bs) var(--line-2); border-radius: var(--radius-s); overflow: hidden; }
  .seg button { background: var(--surface); border: 0; padding: 8px 12px; cursor: pointer; color: var(--text-2); display: inline-flex; gap: 6px; align-items: center; }
  .seg button + button { border-left: var(--bw) var(--bs) var(--line-2); }
  .seg button.on { background: var(--surface-2); color: var(--accent); font-weight: 650; }
  .seg svg { width: 15px; height: 15px; }
  .search { position: relative; flex: 1; min-width: 260px; }
  .search input { width: 100%; padding-left: 36px; }
  .search svg { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); width: 16px; height: 16px; color: var(--text-3); }
  .chip { font-size: 11px; padding: 2px 7px; border-radius: var(--radius-xs); background: var(--surface-2); border: var(--bw) var(--bs) var(--line); color: var(--text-2); white-space: nowrap; }
  .chip.acc { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, var(--line)); }
  .card { background: var(--surface); border: var(--bw) var(--bs) var(--line); border-radius: var(--radius); padding: var(--pad); }
  .card h3 { margin: 0 0 4px; font-size: 15px; }
  .card .sub { margin: 0 0 14px; color: var(--text-2); font-size: 13px; line-height: 1.5; }
  .note { font-size: 12.5px; color: var(--text-2); border: 1px dashed color-mix(in srgb, var(--accent) 40%, var(--line));
    background: color-mix(in srgb, var(--accent) 6%, transparent); border-radius: var(--radius-s); padding: 9px 12px; margin-bottom: 16px; }

  /* ---------- Dashboard ---------- */
  .dash-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 16px; }
  .tile { display: flex; gap: 16px; align-items: flex-start; text-decoration: none; position: relative; }
  .tile .ic { width: 48px; height: 48px; border-radius: var(--radius-s); display: grid; place-items: center; flex: none;
    background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c); }
  .tile .ic svg { width: 24px; height: 24px; }
  .tile .lbl { color: var(--text-2); font-size: 14px; }
  .tile .big { font-size: 34px; font-weight: 750; letter-spacing: -.02em; margin: 2px 0; font-variant-numeric: tabular-nums; }
  .tile .hint { color: var(--text-3); font-size: 12.5px; }
  .tile .hint.good { color: var(--ok); }
  .tile .eye { position: absolute; right: 14px; top: 14px; }
  .tile .blur, #spendCard .blur, .gdlg .blur { filter: blur(7px); user-select: none; }
  a.tile.card:hover { border-color: color-mix(in srgb, var(--c) 45%, var(--line)); }
  .addrow { display: flex; gap: 10px; flex-wrap: wrap; }
  .addrow .btn svg { color: var(--c); }
  .sec-title { display: flex; justify-content: space-between; align-items: baseline; }
  .recent { display: flex; gap: 12px; overflow-x: auto; padding-bottom: 4px; }
  .recent a { flex: none; width: 190px; text-decoration: none; display: flex; gap: 10px; align-items: center; background: var(--bg-2); border: var(--bw) var(--bs) var(--line); border-radius: var(--radius-s); padding: 8px; }
  .recent a:hover { border-color: var(--line-2); }
  .recent .th { width: 52px; height: 40px; border-radius: var(--radius-s); background: var(--surface-2); display: grid; place-items: center; color: var(--c); flex: none; }
  .recent .th svg { width: 22px; height: 22px; }
  .recent b { display: block; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 110px; }
  .recent span { font-size: 11.5px; color: var(--text-3); }
  .bars { display: grid; gap: 10px; }
  .bar { display: grid; grid-template-columns: 110px 1fr 76px; gap: 10px; align-items: center; font-size: 13px; }
  .bar .track { display: block; height: 8px; border-radius: var(--radius-xs); background: var(--surface-2); overflow: hidden; }
  .bar .fill { display: block; height: 100%; border-radius: var(--radius-xs); background: var(--c, var(--kb)); }
  .bar .n { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }

  /* ---------- Gallery ---------- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
  .kcard { background: var(--surface); border: var(--bw) var(--bs) var(--line); border-radius: var(--radius); overflow: hidden; text-decoration: none; display: block; transition: border-color .12s, transform .12s; }
  .kcard:hover { border-color: color-mix(in srgb, var(--accent) 50%, var(--line)); transform: translateY(-2px); }
  .kcard .ph { position: relative; aspect-ratio: 4 / 3; display: grid; place-items: center; color: var(--text-3);
    background: linear-gradient(160deg, var(--surface-2), var(--bg-2)); }
  .kcard .ph svg.big { width: 46px; height: 46px; opacity: .7; }
  .kcard .ph .nophoto { position: absolute; bottom: 12px; font-size: 11.5px; }

function money(n) {
  const r = Math.round((Number(n) || 0) * 100) / 100;
  return (r < 0 ? '−$' : '$') + Math.abs(r).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}
function pct(n) { return ((Number(n) || 0) * 100).toFixed(3).replace(/\.?0+$/, '') + '%'; }
function fmtDate(iso) { // 'YYYY-MM-DD' read as a local date, so it never shifts a day
  if (!iso) return '';

}

const DRAFT_KEY = 'kbc_draft_new_keyboard';
function lsGet(k) { try { return JSON.parse(localStorage.getItem(k) || 'null'); } catch (e) { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } }
function lsDel(k) { try { localStorage.removeItem(k); } catch (e) {} }
function formState() {
  const st = { fields: {}, acq: [], fav: document.getElementById('f_isFavorite').checked, savedAt: Date.now() };
  document.querySelectorAll('.form-grid [id^="f_"]').forEach(el => { if (el.type !== 'checkbox' && el.value !== '') st.fields[el.id] = el.value; });
  st.acq = [...document.querySelectorAll('input[name="acq"]:checked')].map(c => c.value);
  return st;
}
function hasContent(st) { return st && (Object.keys(st.fields).some(k => k !== 'f_keyboardType' || st.fields[k] !== 'custom') || st.acq.length || st.fav); }
function applyState(st) {
  Object.entries(st.fields || {}).forEach(([id, val]) => { const el = document.getElementById(id); if (el) el.value = val; });
  document.querySelectorAll('input[name="acq"]').forEach(c => { c.checked = (st.acq || []).includes(c.value); });
  document.getElementById('f_isFavorite').checked = !!st.fav;
  drawStars();
  if (Object.keys(st.fields || {}).some(k => ['f_modelNumber', 'f_serialNumber', 'f_designer', 'f_layout', 'f_layoutStandard', 'f_bottomRow', 'f_spacebar', 'f_color', 'f_connectivity', 'f_connector', 'f_status', 'f_typingAngle', 'f_frontHeight', 'f_weight'].includes(k)))
    document.getElementById('moreDetails').open = true;
  updateCalc();
}
let draftTimer = null;
function scheduleDraftSave() {
  clearTimeout(draftTimer);
  draftTimer = setTimeout(() => {
    if (!document.getElementById('f_name') || !document.getElementById('draftHint')) return;   // left the Add keyboard form
    const st = formState();
    if (hasContent(st)) { if (lsSet(DRAFT_KEY, st)) document.getElementById('draftHint').textContent = 'Draft saved on this device at ' + new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' }); }
    else { lsDel(DRAFT_KEY); document.getElementById('draftHint').textContent = ''; }
  }, 400);
}
function offerDraft() {
  const st = lsGet(DRAFT_KEY);
  if (!hasContent(st)) return;
  const name = st.fields.f_name ? `"${st.fields.f_name}"` : 'an unnamed keyboard';
  const when = new Date(st.savedAt).toLocaleString([], { month: 'short', day: 'numeric', hour: 'numeric', minute: '2-digit' });
  const bar = document.getElementById('draftBar');
  bar.innerHTML = `<div class="draftbar"><span>You have an unfinished keyboard, ${esc(name)}, from ${esc(when)}.</span>
    <span class="btnrow"><button class="btn primary" id="draftResume">Resume draft</button><button class="btn" id="draftFresh">Start fresh</button></span></div>`;
  document.getElementById('draftResume').onclick = () => { applyState(st); bar.innerHTML = ''; document.getElementById('draftHint').textContent = 'Draft restored'; };
  document.getElementById('draftFresh').onclick = () => { lsDel(DRAFT_KEY); bar.innerHTML = ''; };
}

function num(id) { const v = document.getElementById(id)?.value; return v === '' || v == null ? 0 : Number(v); }

  document.getElementById('cPriceTax').textContent = money(k.price * (1 + k.taxRate));

  const imgs = files.filter(f => /^image\/(jpeg|png|webp)$/.test(f.type));
  if (files.length && !imgs.length) { toast('Only JPG, PNG or WebP images can be added.'); return; }
  if (files.length > imgs.length) toast(`${files.length - imgs.length} file(s) skipped: only JPG, PNG or WebP.`);
  if (photoQueueBusy) { toast('Finish the current photo first.'); return; }
  photoQueueBusy = true;
  try {
    for (let i = 0; i < imgs.length; i++) {
      const f = imgs[i];
      let img;
      try { img = await loadImage(await fileToDataUrl(f)); } catch (e) { toast(f.name + ': ' + e.message); continue; }
      const out = await cropDialog(img, f.name, imgs.length > 1 ? `Photo ${i + 1} of ${imgs.length}` : '');
      if (!out) continue;   // skipped
      await addPhoto(k, out, f.name);
    }
  } finally { photoQueueBusy = false; }
}
async function addPhoto(k, out, fileName) {
  try {
    const ref = photoCol().doc();
    await withTimeout(ref.set({ itemType: photoType, itemId: k.id, full: out.full, thumb: out.thumb, bytes: out.bytes, width: out.width, height: out.height, fileName, createdAt: firebase.firestore.FieldValue.serverTimestamp() }), 30000);
    await metaRef().set({ photoCount: firebase.firestore.FieldValue.increment(1), photoBytes: firebase.firestore.FieldValue.increment(out.bytes) }, { merge: true });
    const cur = photoItem(k);
    if (!cur.coverPhotoId) await setCover(k.id, { id: ref.id, thumb: out.thumb });
    toast('Photo saved');
  } catch (e) { toast('Photo not saved: ' + explain(e)); }
}
async function replacePhoto(k, p, out) {
  try {
    await withTimeout(photoCol().doc(p.id).update({ full: out.full, thumb: out.thumb, bytes: out.bytes, width: out.width, height: out.height }), 30000);
    await metaRef().set({ photoBytes: firebase.firestore.FieldValue.increment(out.bytes - (p.bytes || 0)) }, { merge: true });
    const cur = photoItem(k);
    if (cur.coverPhotoId === p.id) await setCover(k.id, { id: p.id, thumb: out.thumb });
    if (cur.stockPhotoId === p.id) await withTimeout(colOfType(photoType).doc(k.id).update({ stockThumb: out.thumb }));
    if (cur.kitStockCover && cur.kitStockCover.photoId === p.id) await withTimeout(kcCol().doc(k.id).update({ kitStockCover: { photoId: p.id, thumb: out.thumb } }));
    toast('Crop saved');
  } catch (e) { toast('Crop not saved: ' + explain(e)); }
}
async function deletePhoto(k, p) {
  if (!await askConfirm('Delete this photo? This cannot be undone.')) return;
  try {
    await withTimeout(photoCol().doc(p.id).delete());
    await metaRef().set({ photoCount: firebase.firestore.FieldValue.increment(-1), photoBytes: firebase.firestore.FieldValue.increment(-(p.bytes || 0)) }, { merge: true });
    const cur = photoItem(k);
    if (cur.coverPhotoId === p.id) { const next = currentPhotos.find(x => x.id !== p.id); await setCover(k.id, next || null); }
    const del = firebase.firestore.FieldValue.delete();
    if (cur.stockPhotoId === p.id) await withTimeout(colOfType(photoType).doc(k.id).update({ stockPhotoId: del, stockThumb: del }));
    if ((cur.kitStock || []).some(x => x.photoId === p.id)) await writeKitStock(cur, cur.kitStock.filter(x => x.photoId !== p.id), '');
    toast('Photo deleted');
  } catch (e) { toast('Delete failed: ' + explain(e)); }
}
async function deletePhotosOf(itemId) {   // used when a keyboard, switch entry or keycap set is deleted
  const snap = await photoCol().where('itemId', '==', itemId).get();
  let n = 0, bytes = 0;
  const gone = [];
  for (const d of snap.docs) { bytes += d.data().bytes || 0; n++; gone.push({ id: d.id, data: d.data() }); await d.ref.delete(); }
  if (n) await metaRef().set({ photoCount: firebase.firestore.FieldValue.increment(-n), photoBytes: firebase.firestore.FieldValue.increment(-bytes) }, { merge: true });
  return gone;
}

/* ---------- Crop dialog: drag to move, zoom, rotate, live preview; output is 4:3 ---------- */
function cropDialog(img, fileName, counter = '') {
  return new Promise(resolve => {
    const wrap = document.createElement('div');
    wrap.className = 'modal-bg';
    wrap.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="Crop photo">
      <h3>Crop photo${counter ? ` <span class="sub">· ${esc(counter)}</span>` : ''}</h3>
      <p class="sub">Drag to move the photo and zoom so the card looks right. ${esc(fileName)}</p>
      <div class="crop-row">
        <canvas id="cropCv" width="640" height="480" class="cropcv"></canvas>
        <div class="crop-side">
          <div class="k">Card preview</div><canvas id="cropPv" width="240" height="180" class="croppv"></canvas>
          <div class="k" style="margin-top:14px">Zoom</div><input type="range" id="cropZoom" min="1" max="4" step="0.01" value="1" aria-label="Zoom">
          <div class="k" style="margin-top:14px">Rotate</div>
          <div class="btnrow"><button class="btn" id="rotL" aria-label="Rotate left">⟲ Left</button><button class="btn" id="rotR" aria-label="Rotate right">⟳ Right</button></div>
        </div>
      </div>
      <div class="btnrow" style="justify-content:flex-end;margin-top:16px">
        ${counter ? '<button class="btn" id="cropSkip">Skip this photo</button>' : ''}<button class="btn" id="cropCancel">Cancel</button><button class="btn primary" id="cropSave">Save crop</button></div></div>`;
    document.body.appendChild(wrap);
    const cv = wrap.querySelector('#cropCv'), pv = wrap.querySelector('#cropPv'), zoomEl = wrap.querySelector('#cropZoom');
    const st = { rot: 0, zoom: 1, x: 0, y: 0 };   // x,y = offset of image centre from frame centre, in frame pixels
    const srcW = () => (st.rot % 180 ? img.height : img.width), srcH = () => (st.rot % 180 ? img.width : img.height);
    const baseScale = (W, H) => Math.max(W / srcW(), H / srcH());   // "cover" fit at zoom 1
    function clamp() {
      const s = baseScale(cv.width, cv.height) * st.zoom, w = srcW() * s, h = srcH() * s;
      const mx = Math.max(0, (w - cv.width) / 2), my = Math.max(0, (h - cv.height) / 2);
      st.x = Math.min(mx, Math.max(-mx, st.x)); st.y = Math.min(my, Math.max(-my, st.y));
    }
    function draw(c) {
      const W = c.width, H = c.height, f = W / cv.width, ctx = c.getContext('2d');
      const s = baseScale(W, H) * st.zoom;
      ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
      ctx.save(); ctx.translate(W / 2 + st.x * f, H / 2 + st.y * f); ctx.rotate(st.rot * Math.PI / 180);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, -img.width * s / 2, -img.height * s / 2, img.width * s, img.height * s);
      ctx.restore();
    }
    const redraw = () => { clamp(); draw(cv); draw(pv); };
    let drag = null;
    cv.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY, sx: st.x, sy: st.y }; cv.setPointerCapture(e.pointerId); });
    cv.addEventListener('pointermove', e => { if (!drag) return; const r = cv.width / cv.getBoundingClientRect().width; st.x = drag.sx + (e.clientX - drag.x) * r; st.y = drag.sy + (e.clientY - drag.y) * r; redraw(); });
    cv.addEventListener('pointerup', () => { drag = null; });
    cv.addEventListener('wheel', e => { e.preventDefault(); st.zoom = Math.min(4, Math.max(1, st.zoom * (e.deltaY < 0 ? 1.08 : 1 / 1.08))); zoomEl.value = st.zoom; redraw(); }, { passive: false });
    zoomEl.oninput = () => { st.zoom = Number(zoomEl.value); redraw(); };
    wrap.querySelector('#rotL').onclick = () => { st.rot = (st.rot + 270) % 360; redraw(); };
    wrap.querySelector('#rotR').onclick = () => { st.rot = (st.rot + 90) % 360; redraw(); };
    const close = v => { document.removeEventListener('keydown', onKey); wrap.remove(); resolve(v); };
    const onKey = e => { if (e.key === 'Escape') close(null); };
    document.addEventListener('keydown', onKey);
    wrap.querySelector('#cropCancel').onclick = () => close(null);
    if (counter) wrap.querySelector('#cropSkip').onclick = () => close(null);
    wrap.querySelector('#cropSave').onclick = async () => {
      const btn = wrap.querySelector('#cropSave'); btn.disabled = true; btn.textContent = 'Saving…';
      // never upscale: the output is at most the photo's own resolution inside the frame
      const visW = cv.width / (baseScale(cv.width, cv.height) * st.zoom);
      const scaleW = Math.min(PHOTO_FULL.w, Math.round(visW));
      const fw = Math.max(320, Math.min(PHOTO_FULL.w, scaleW)), fh = Math.round(fw * 3 / 4);
      let full = '';
      for (const sizeStep of [1, 0.8, 0.64]) {
        const c = document.createElement('canvas'); c.width = Math.round(fw * sizeStep); c.height = Math.round(fh * sizeStep); draw(c);
        for (const q of PHOTO_FULL.q) { full = c.toDataURL('image/webp', q); if (full.length < MAX_DOC_CHARS) break; }
        if (full.length < MAX_DOC_CHARS) { var outW = c.width, outH = c.height; break; }
      }
      const t = document.createElement('canvas'); t.width = PHOTO_THUMB.w; t.height = PHOTO_THUMB.h; draw(t);
      const thumb = t.toDataURL('image/webp', PHOTO_THUMB.q);
      if (!full.startsWith('data:image/webp')) { toast('This browser cannot make WebP images; saving as JPEG instead.'); }
      close({ full, thumb, bytes: Math.round((full.length + thumb.length) * 3 / 4), width: outW, height: outH });
    };
    redraw();
  });
}

/* ===================== Save / Discard at the top, next to Delete =====================
   Mirrors the real Save and Discard buttons (same disabled state and wording) so nothing else changes. */
function ensureTopSave() {
  const tools = document.querySelector('#view .pagehead .tools'), del = tools && tools.querySelector('#btnDelete');
  const sv = document.getElementById('btnSave'), cn = document.getElementById('btnCancel');
  if (!del || !sv || !cn) return;
  let ts = document.getElementById('btnSaveTop'), tc = document.getElementById('btnCancelTop');
  if (!ts) {
    del.insertAdjacentHTML('beforebegin', '<button class="btn topsave" id="btnCancelTop" type="button"></button><button class="btn primary topsave" id="btnSaveTop" type="button"></button>');
    ts = document.getElementById('btnSaveTop'); tc = document.getElementById('btnCancelTop');
    ts.onclick = () => document.getElementById('btnSave')?.click(); tc.onclick = () => document.getElementById('btnCancel')?.click();
    sv.closest('.savebar')?.classList.add('hasTop');
  }
  const sync = () => { const a = document.getElementById('btnSave'), b = document.getElementById('btnCancel'); if (!a || !b || !ts.isConnected) return;
    if (ts.textContent !== a.textContent) ts.textContent = a.textContent; if (ts.disabled !== a.disabled) ts.disabled = a.disabled;
    if (tc.textContent !== b.textContent) tc.textContent = b.textContent; if (tc.disabled !== b.disabled) tc.disabled = b.disabled; };

new MutationObserver(() => ensureTopSave()).observe(document.getElementById('view'), { childList: true, subtree: true });

      <td><select class="select" data-swdet="${i}"><option value="">Skip</option>${opts.map(w => `<option value="${esc(w.id)}"${ids[0] === w.id ? ' selected' : ''}>${esc([w[T.maker], w.name, T.one === 'keyboard' && w.color ? '(' + w.color + ')' : ''].filter(Boolean).join(' '))}${w.datePurchased ? ' · ' + esc(fmtDate(w.datePurchased)) : ''}</option>`).join('')}</select>${ids.length > 1 ? `<div class="sub" style="margin:0">+ ${ids.length - 1} more entr${ids.length === 2 ? 'y' : 'ies'} with this name</div>` : ''}</td>

/* ===================== Step K.3: kit photos from the old Keycap Collection app =====================
   The photos stay in the old repo (fniskeebs69.github.io/keycaps) and are shown from there; only their links are saved,

  hit = sets.filter(s => oldRoundless(s.name) === oldRoundless(name)); if (hit.length === 1) return { id: hit[0].id, how: 'close' };
  hit = sets.filter(s => k.length >= 4 && oldSetKey(s.name).startsWith(k)); if (hit.length === 1) return { id: hit[0].id, how: 'close' };

  const rows = oldPhotos.sets.map(o => { const pk = oldPhotoPicks[o.oldId], n = o.kits.filter(k => k.url).length, cur = pk.id && savedKeycaps.find(s => s.id === pk.id);

/* ===================== Step 9.4: share as image =====================
   Everything is drawn on a canvas in the browser from data already on screen; nothing is uploaded.
   Photos are data URLs, so the canvas can be saved. GMK catalog colors are left out of shared images (private data). */
const SHARE_FONT = 'system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif';
function loadImg(src) { return new Promise(r => { if (!src) return r(null); const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; }); }

const SH = { bg: '#0f1115', card: '#181b22', line: '#262a33', text: '#f3f4f6', text2: '#b4b9c4', text3: '#7c8290', accent: '#2dd4bf' };
async function shareGridCanvas(title, items) {
  const cols = Math.min(4, Math.max(1, items.length)), cw = 320, ph = 240, th = 78, gap = 16, pad = 32, head = 104;
  const rows = Math.ceil(items.length / cols), W = pad * 2 + cols * cw + (cols - 1) * gap, H = head + pad + rows * (ph + th) + (rows - 1) * gap + 40;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');
  ctx.fillStyle = SH.bg; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = SH.accent; ctx.font = `600 13px ${SHARE_FONT}`; ctx.fillText('FSN · KEYBOARD COLLECTION', pad, 42);
  ctx.fillStyle = SH.text; ctx.font = `700 28px ${SHARE_FONT}`; ctx.fillText(fitText(ctx, title, W - pad * 2 - 220), pad, 78);
  ctx.fillStyle = SH.text3; ctx.font = `14px ${SHARE_FONT}`; ctx.textAlign = 'right'; ctx.fillText(`${items.length} item${items.length === 1 ? '' : 's'} · ${new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' })}`, W - pad, 78); ctx.textAlign = 'left';
  const imgs = await Promise.all(items.map(it => loadImg(it.thumb)));

    if (imgs[i]) drawCover(ctx, imgs[i], x, y, cw, ph); else { ctx.fillStyle = '#1e222b'; ctx.fillRect(x, y, cw, ph); ctx.fillStyle = SH.text3; ctx.font = `13px ${SHARE_FONT}`; ctx.textAlign = 'center'; ctx.fillText('No photo', x + cw / 2, y + ph / 2 + 4); ctx.textAlign = 'left'; }
    ctx.restore(); ctx.strokeStyle = SH.line; rrect(ctx, x + .5, y + .5, cw - 1, ph + th - 1, 12); ctx.stroke();
    ctx.fillStyle = SH.text; ctx.font = `600 15px ${SHARE_FONT}`; ctx.fillText(fitText(ctx, it.name, cw - 24), x + 12, y + ph + 24);
    ctx.fillStyle = SH.text2; ctx.font = `13px ${SHARE_FONT}`; ctx.fillText(fitText(ctx, it.sub, cw - 24), x + 12, y + ph + 44);

}
async function buildCardCanvas(k, withSpend) {
  const W = 1080, P = 56; let full = null;

  const img = await loadImg(full || k.coverThumb || k.stockThumb);
  const sw = switchesOn(k.id).map(({ w, a }) => [[w.manufacturer, w.name].filter(Boolean).join(' '), `× ${a.count}`]);
  const kc = kitsOn(k.id).map(({ s, k: kit }) => [s.name, kit.name]);
  const pt = partsOn(k.id).map(({ t, x }) => [x.name, partRole(t, x)]);
  const sections = [['Switches', sw], ['Keycaps', kc], ['Parts', pt]].filter(s => s[1].length);
  const meas = document.createElement('canvas').getContext('2d'); meas.font = `20px ${SHARE_FONT}`;
  const photoH = img ? 810 : 0, colors = shareColors(k.colorway);

  sections.forEach(s => { H += 50 + s[1].length * 34; }); if (!sections.length) H += 40; if (withSpend) H += 70; H += 70;
  const cv = document.createElement('canvas'); cv.width = W; cv.height = H; const ctx = cv.getContext('2d');

      <div style="max-height:420px;overflow:auto;border-radius:12px"><table class="list"><thead><tr><th>Row</th><th>Status</th><th>${T.key === 'keyboards' ? 'Brand' : 'Maker'}</th><th>Name</th><th>${T.key === 'switches' ? 'Type · count' : T.nested ? 'Profile · kits' : T.key === 'keyboards' ? 'Size' : 'Details'}</th><th>Purchased</th><th style="text-align:right">Total</th><th>Changes</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td>${T.nested ? r.x.excelRows.join(', ') : r.x.excelRow}</td><td>${label[r.status]}</td><td>${esc(T.who(r.x) || '')}</td><td><b>${esc(r.x.name)}</b>${r.x.color ? ` <span style="color:var(--text-3)">${esc(r.x.color)}</span>` : ''}</td>
          <td>${esc(T.detail(r.x))}</td><td>${esc(fmtDate(T.nested ? setDate(r.x) : r.x.datePurchased))}</td><td style="text-align:right;font-variant-numeric:tabular-nums">${money(rowTotal(r.x))}</td>

async function runImport(rows) {
  const T = importType, btn = document.getElementById('impGo'), st = document.getElementById('impStatus');
  const todo = rows.filter(r => r.status !== 'same');
  if (!await askConfirm(`Import ${todo.length} ${impWord(T, todo.length)} into the app?`)) return;
  btn.disabled = true;
  const now = firebase.firestore.FieldValue.serverTimestamp(), del = firebase.firestore.FieldValue.delete();
  let done = 0;
  try {
    for (let i = 0; i < todo.length; i += 400) {           // Firestore batches hold up to 500 writes
      const batch = db.batch();
      todo.slice(i, i + 400).forEach(r => {
        if (T.nested) {
          const rec = Object.assign(keycapRecord(r), { importKey: r.x.importKey, source: 'excel', importedFrom: importFile.source, importedAt: now, updatedAt: now });
          if (r.cur) batch.update(T.col().doc(r.cur.id), rec);
          else batch.set(T.col().doc(), Object.assign(rec, { createdAt: now, isFavorite: false, appVersion: APP_VERSION }));
          return;
        }
        const rec = {};
        T.fields.forEach(f => { if (r.x[f] !== undefined && r.x[f] !== '' && r.x[f] !== null) rec[f] = r.x[f]; else if (r.cur && r.cur[f] !== undefined && !(T.fillOnly || []).includes(f)) rec[f] = del; });   // specs the workbook leaves blank are kept
        Object.assign(rec, { importKey: r.x.importKey, source: 'excel', importedFrom: importFile.source, importedAt: now, updatedAt: now });
        if (r.cur) batch.update(T.col().doc(r.cur.id), rec);
        else batch.set(T.col().doc(), Object.assign(rec, T.extraNew(r.x), { createdAt: now, isFavorite: false, appVersion: APP_VERSION }));
      });
      await withTimeout(batch.commit(), 30000);
      done += Math.min(400, todo.length - i);
      st.textContent = `Imported ${done} of ${todo.length}…`;
    }
    await importMetaRef().set({ [T.metaKey || T.key]: { file: importFile.fileName, source: importFile.source, exportedAt: importFile.exportedAt, count: importFile.count,
      excelTotal: importFile.excelTotal, excelTotalRow: importFile.excelTotalRow ?? null, importedAt: now, ...(importFile.excelTotalLabel ? { excelTotalLabel: importFile.excelTotalLabel } : {}),
      ...(T.nested ? { kitCount: importFile.kitCount, fileTotal: Math.round(importFile[T.key].reduce((t, x) => t + kitsOf(x).reduce((u, k) => u + kbTotal(k), 0), 0) * 100) / 100, formulaMismatches: (importFile.totalMismatches || []).length } : {}) } }, { merge: true });
    const what = impWord(T, done);
    toast(`Imported ${done} ${what}`);
    lastImportMsg = `Done: ${done} ${what} imported at ${new Date().toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' })}. Everything now matches this file.`;
    const st2 = document.getElementById('impStatus'); if (st2) st2.textContent = lastImportMsg;
    drawReconcile();
  } catch (e) { st.textContent = `Stopped after ${done}: ${explain(e)} Run the import again to finish; nothing is duplicated.`; btn.disabled = false; }
}

function explain(err) {

  if (err && err.code === 'unavailable') return 'Firebase is unreachable (offline?).';

function fmtTime(ts) { if (!ts) return 'pending…'; const d = ts.toDate ? ts.toDate() : new Date(ts); return d.toLocaleString(); }
/* ===================== Backup and restore (Settings) =====================
   Backup file: { kind: 'kbc_backup', version, app, createdAt, full, collections: { <name>: { <docId>: data } } }.
   Firestore timestamps are written as { __ts: milliseconds }. Restore sets each record by its id (overwrite); it never deletes. */
const BACKUP_COLS = ['keyboards', 'switches', 'keycaps', 'pcbs', 'artisans', 'accessories', 'deskmats', 'switchparts', 'wishlist', 'timeline'], BACKUP_BLOBS = ['photos', 'sounds'];
const rootDoc = () => db.collection(FIRESTORE_COLLECTION).doc(ROOT_DOC);
function bkEncode(v) { if (v && typeof v.toDate === 'function') return { __ts: v.toDate().getTime() }; if (Array.isArray(v)) return v.map(bkEncode); if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = bkEncode(v[k]); return o; } return v; }
function bkDecode(v) { if (v && typeof v === 'object' && typeof v.__ts === 'number' && Object.keys(v).length === 1) return firebase.firestore.Timestamp.fromMillis(v.__ts); if (Array.isArray(v)) return v.map(bkDecode); if (v && typeof v === 'object') { const o = {}; for (const k in v) o[k] = bkDecode(v[k]); return o; } return v; }
async function makeBackup(full) {
  const msg = document.getElementById('backupMsg'), btns = [document.getElementById('btnBackup'), document.getElementById('btnBackupFull')];
  btns.forEach(b => b.disabled = true);
  try {
    const out = { kind: 'kbc_backup', version: 1, app: APP_VERSION, createdAt: new Date().toISOString(), full: !!full, collections: {} }, counts = [];
    for (const c of BACKUP_COLS.concat(full ? BACKUP_BLOBS : [])) {
      msg.textContent = `Reading ${c}…`;
      const snap = await withTimeout(rootDoc().collection(c).get(), 180000), o = {};
      snap.docs.forEach(d => { if (!d.id.startsWith('_')) o[d.id] = bkEncode(d.data()); });
      out.collections[c] = o; counts.push(`${Object.keys(o).length} ${c}`);
    }
    const blob = new Blob([JSON.stringify(out)], { type: 'application/json' }), a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = `keyboard_collection_backup_${todayIso()}${full ? '_full' : ''}.json`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    lsSet('kbc_last_backup', { at: out.createdAt, full: !!full });
    msg.textContent = `Backup saved (${(blob.size / 1048576).toFixed(1)} MB): ${counts.join(', ')}.`; toast('Backup downloaded');
  } catch (e) { msg.textContent = 'Backup failed: ' + explain(e); }
  btns.forEach(b => b.disabled = false);
}
let restoreData = null;
function drawRestorePreview(note) {
  const box = document.getElementById('restorePreview'); if (!box) return;
  if (!restoreData) { box.innerHTML = note ? `<p class="sub" style="margin:0;color:var(--danger)">${esc(note)}</p>` : ''; return; }
  const cols = Object.keys(restoreData.collections).filter(c => BACKUP_COLS.concat(BACKUP_BLOBS).includes(c)), n = cols.reduce((a, c) => a + Object.keys(restoreData.collections[c]).length, 0);
  box.innerHTML = `<p class="sub" style="margin:0 0 6px">Backup from <b>${esc(fmtDate(String(restoreData.createdAt).slice(0, 10)))}</b> (${esc(restoreData.app || '')}, ${restoreData.full ? 'everything' : 'records only'}):</p>
    <div class="kv" style="word-break:normal">${cols.map(c => `${esc(c)}: ${Object.keys(restoreData.collections[c]).length}`).join('<br>')}</div>

  document.getElementById('btnRestoreCancel').onclick = () => { restoreData = null; drawRestorePreview(); };
  document.getElementById('btnRestoreGo').onclick = runRestore;
}
async function runRestore() {
  const d = restoreData; if (!d) return; const msg = document.getElementById('restoreMsg'), btn = document.getElementById('btnRestoreGo');
  const cols = Object.keys(d.collections).filter(c => BACKUP_COLS.concat(BACKUP_BLOBS).includes(c)), n = cols.reduce((a, c) => a + Object.keys(d.collections[c]).length, 0);
  if (!await askConfirm(`Restore ${n} records from the backup of ${fmtDate(String(d.createdAt).slice(0, 10))}?\n\nEach record in the file replaces the current one. Changes made to those records after the backup are lost. Records not in the file are kept.`)) return;
  btn.disabled = true; let done = 0;
  try {
    for (const c of cols) {
      const ids = Object.keys(d.collections[c]), blob = BACKUP_BLOBS.includes(c), step = blob ? 1 : 50;
      for (let i = 0; i < ids.length; i += step) {
        const b = db.batch(); ids.slice(i, i + step).forEach(id => b.set(rootDoc().collection(c).doc(id), bkDecode(d.collections[c][id])));
        await withTimeout(b.commit(), 60000); done += Math.min(step, ids.length - i); msg.textContent = `Restoring… ${done} of ${n}`;
      }
    }
    if (cols.some(c => BACKUP_BLOBS.includes(c))) { msg.textContent = 'Counting photos and recordings…'; await recountStorage(); }
    restoreData = null; drawRestorePreview(); document.getElementById('restorePreview').innerHTML = `<p class="sub" style="margin:0;color:var(--ok-text)">Restored ${n} records.</p>`; toast('Backup restored');

}
async function recountStorage() {   // reads every photo and recording once and resets the counters behind the meter
  const sum = async c => { const snap = await withTimeout(rootDoc().collection(c).get(), 180000); let n = 0, b = 0; snap.docs.forEach(x => { n++; b += x.data().bytes || 0; }); return [n, b]; };

}
