<style>
  :root {
    --bg: #101217;
    --bg-2: #14171d;
    --surface: #1a1e26;
    --surface-2: #222732;
    --line: #2b3140;
    --text: #e9ebf0;
    --text-2: #a3a9b8;
    --text-3: #6d7486;
    --kb: #f5a524;   /* Keyboards */
    --kc: #2dd4bf;   /* Keycaps */
    --sw: #fb7185;   /* Switches */
    --ac: #a78bfa;   /* Accessories */
    --accent: var(--kb);
    --radius: 16px;
    --safe-top: env(safe-area-inset-top, 0px);
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 600px at 50% -200px, #1b2030 0%, var(--bg) 60%) fixed, var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    -webkit-tap-highlight-color: transparent;
  }
  button { font: inherit; color: inherit; }

  /* ---------- Protocol warning ---------- */
  #protoWarn {
    display: none;
    margin: calc(12px + var(--safe-top)) 16px 0;
    padding: 14px 16px;
    border-radius: 12px;
    background: #3a1d22;
    border: 1px solid #7a2e3a;
    color: #ffd7dc;
    font-size: 14px;
    line-height: 1.45;
  }
  #protoWarn strong { color: #fff; }

  /* ---------- Layout ---------- */
  .view { display: none; min-height: 100vh; flex-direction: column; }
  .view.active { display: flex; animation: enter .22s ease-out; }
  @keyframes enter { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .view.active { animation: none; } }
  .wrap { width: 100%; max-width: 980px; margin: 0 auto; padding: 0 18px; }

  /* ---------- Home ---------- */
  .home-head { padding-top: calc(28px + var(--safe-top)); padding-bottom: 8px; }
  .eyebrow { font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: var(--text-3); font-weight: 600; }
  .home-head h1 { margin: 6px 0 4px; font-size: 30px; letter-spacing: -.02em; font-weight: 750; }
  .home-head p { margin: 0; color: var(--text-2); font-size: 15px; }

  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 22px 0 18px; }
  @media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, 1fr); gap: 16px; } }
  .tile {
    position: relative; text-align: left; cursor: pointer;
    background: linear-gradient(180deg, var(--surface) 0%, var(--bg-2) 100%);
    border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 16px 14px; min-height: 168px;
    display: flex; flex-direction: column; gap: 10px;
    transition: transform .15s ease, border-color .15s ease, box-shadow .15s ease;
    overflow: hidden;
  }
  .tile::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--c);
  }
  .tile:hover, .tile:focus-visible { border-color: color-mix(in srgb, var(--c) 55%, var(--line)); transform: translateY(-2px);
    box-shadow: 0 10px 30px -12px color-mix(in srgb, var(--c) 45%, transparent); outline: none; }
  .tile:active { transform: translateY(0) scale(.99); }
  .tile .ico {
    width: 42px; height: 42px; border-radius: 12px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--c) 14%, transparent); color: var(--c);
  }
  .tile .ico svg { width: 24px; height: 24px; }
  .tile h2 { margin: 2px 0 0; font-size: 17px; font-weight: 700; letter-spacing: -.01em; }
  .tile .desc { margin: 0; font-size: 13px; color: var(--text-2); line-height: 1.4; flex: 1; }
  .tile .meta { display: flex; justify-content: space-between; align-items: center; font-size: 12px; color: var(--text-3); }
  .pill { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--text-2); white-space: nowrap; }
  .pill.live { color: var(--c); border-color: color-mix(in srgb, var(--c) 45%, var(--line)); background: color-mix(in srgb, var(--c) 10%, transparent); }
  .chev { color: var(--text-3); }

  .foot { margin-top: auto; padding-top: 18px; padding-bottom: calc(18px + var(--safe-bottom)); display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
    font-size: 12px; color: var(--text-3); border-top: 1px solid var(--line); background-clip: content-box; }
  .status { display: inline-flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--text-3); }
  .dot.ok { background: #34d399; }
  .dot.bad { background: #f87171; }

  /* ---------- Category page ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 5;
    padding-top: var(--safe-top);
    background: color-mix(in srgb, var(--bg) 88%, transparent);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--line);
  }
  .topbar .wrap { display: flex; align-items: center; gap: 10px; height: 58px; }
  .back {
    width: 40px; height: 40px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface);
    display: grid; place-items: center; cursor: pointer;
  }
  .back:hover { border-color: var(--accent); }
  .topbar .ttl { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .topbar .ttl .ico { width: 30px; height: 30px; border-radius: 9px; display: grid; place-items: center;
    background: color-mix(in srgb, var(--accent) 16%, transparent); color: var(--accent); }
  .topbar .ttl .ico svg { width: 18px; height: 18px; }
  .topbar h1 { margin: 0; font-size: 19px; font-weight: 700; letter-spacing: -.01em; }
  .accent-rule { height: 2px; background: linear-gradient(90deg, var(--accent), transparent 70%); }

  .empty {
    margin: 56px auto 40px; max-width: 420px; text-align: center; padding: 0 12px;
  }
  .empty .big { width: 84px; height: 84px; margin: 0 auto 18px; border-radius: 24px; display: grid; place-items: center;
    color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); }
  .empty .big svg { width: 42px; height: 42px; }
  .empty h2 { margin: 0 0 8px; font-size: 20px; }
  .empty p { margin: 0; color: var(--text-2); font-size: 14.5px; line-height: 1.55; }
  .empty .note { margin-top: 18px; display: inline-block; font-size: 12px; color: var(--text-3);
    border: 1px dashed var(--line); border-radius: 10px; padding: 8px 12px; }
</style>
</head>
<body>

<div id="protoWarn" role="alert"></div>

<!-- ================= HOME ================= -->
<section class="view" id="view-home" aria-label="Home">
  <div class="wrap home-head">
    <div class="eyebrow">Faraz's</div>
    <h1>Keyboard Collection</h1>
    <p>Pick a category to open its page.</p>
  </div>
  <div class="wrap">
    <div class="tiles" id="tiles"></div>
  </div>
  <div class="wrap foot">
    <span class="status"><span class="dot" id="fbDot"></span><span id="fbText">Checking…</span></span>
    <span id="verText"></span>
  </div>
</section>

<!-- ================= CATEGORY PAGE (shared template) ================= -->
<section class="view" id="view-page" aria-label="Category">
  <header class="topbar">
    <div class="wrap">
      <button class="back" id="backBtn" aria-label="Back to home">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </button>
      <div class="ttl"><span class="ico" id="pageIco"></span><h1 id="pageTitle"></h1></div>
    </div>
    <div class="accent-rule"></div>
  </header>
  <main class="wrap" id="pageBody"></main>
  <div class="wrap foot">
    <span id="pageFootLeft"></span>
    <span id="verText2"></span>
  </div>
</section>

<script>
/* ===================== App constants ===================== */
const APP_VERSION = 'v0.1.0';
const FIRESTORE_COLLECTION = 'keyboard_collection'; // separate from keycap_tracker (D2). Not used until Step 1.2.

/* Firebase config baked in (guardrail). Same project as the Keycap Collection app (D2). */
const firebaseConfig = {
  apiKey: "AIzaSyCs8P0e-2ogCUA5vIquB-1pX6oBXeSOyEk",
  authDomain: "fsn-keycap-tracker-b384e.firebaseapp.com",
  projectId: "fsn-keycap-tracker-b384e",
  storageBucket: "fsn-keycap-tracker-b384e.firebasestorage.app",
  messagingSenderId: "988653850561",
  appId: "1:988653850561:web:f99ffc671e5be637896940"
};

/* ===================== Icons ===================== */
const ICONS = {
  keyboards: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2.5"/><path d="M6 10h.01M9.5 10h.01M13 10h.01M16.5 10h.01M6 13.5h.01M18 10h.01M18 13.5h.01M8.5 14.5h7"/></svg>',
  keycaps:   '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M5 18l1.6-10.2A2 2 0 0 1 8.6 6h6.8a2 2 0 0 1 2 1.8L19 18"/><path d="M3.5 18h17"/><path d="M9 10.5h6"/></svg>',
  switches:  '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="9" width="16" height="11" rx="2"/><path d="M12 3v6M9.5 5.5h5"/><path d="M8 20v1.5M16 20v1.5"/></svg>',
  accessories:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3v4M15 3v4"/><rect x="7" y="7" width="10" height="6" rx="1.5"/><path d="M12 13v3a4 4 0 0 1-4 4H5"/></svg>'
};

/* ===================== Pages ===================== */
const PAGES = [
  { id: 'keyboards',   title: 'Keyboards',   color: 'var(--kb)', built: true,
    desc: 'Boards, builds, specs and what you paid.',
    empty: 'No keyboards yet', emptyText: 'Your keyboards will appear here. Sample keyboards come in Step 2.1, and your Excel list is imported in Phase 3.' },
  { id: 'keycaps',     title: 'Keycaps',     color: 'var(--kc)', built: false,
    desc: 'Sets, kits and color palettes.',
    empty: 'Keycaps page coming later', emptyText: 'Your Keycap Collection app will move in here once the Keyboards page is finished.' },
  { id: 'switches',    title: 'Switches',    color: 'var(--sw)', built: false,
    desc: 'Switch specs, counts and where they are installed.',
    empty: 'Switches page coming later', emptyText: 'This page is built after Keyboards (roadmap Phase 4).' },
  { id: 'accessories', title: 'Accessories', color: 'var(--ac)', built: false,
    desc: 'Cables, cases, tools and the rest.',
    empty: 'Accessories page coming later', emptyText: 'This page is built after Keycaps (roadmap Step 6.3). Cables live here as a category.' }
];

/* ===================== Render home ===================== */
const tilesEl = document.getElementById('tiles');
tilesEl.innerHTML = PAGES.map(p => `
  <button class="tile" style="--c:${p.color}" data-page="${p.id}" aria-label="Open ${p.title}">
    <span class="ico">${ICONS[p.id]}</span>
    <h2>${p.title}</h2>
    <p class="desc">${p.desc}</p>
    <span class="meta">
      <span class="pill ${p.built ? 'live' : ''}">${p.built ? 'Building now' : 'Coming later'}</span>
      <svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"/></svg>
    </span>
  </button>`).join('');
tilesEl.addEventListener('click', e => {
  const t = e.target.closest('.tile');
  if (t) location.hash = '#/' + t.dataset.page;
});
document.getElementById('verText').textContent = APP_VERSION;
document.getElementById('verText2').textContent = APP_VERSION;

/* ===================== Router (hash based, so the phone's back gesture works) ===================== */
const homeView = document.getElementById('view-home');
const pageView = document.getElementById('view-page');

function show(view) {
  [homeView, pageView].forEach(v => v.classList.toggle('active', v === view));
  window.scrollTo(0, 0);
}

function renderPage(p) {
  document.documentElement.style.setProperty('--accent', p.color);
  document.getElementById('pageIco').innerHTML = ICONS[p.id];
  document.getElementById('pageTitle').textContent = p.title;
  document.title = p.title + ' · Keyboard Collection';
  document.getElementById('pageFootLeft').textContent = p.built ? '0 items' : 'Not built yet';
  document.getElementById('pageBody').innerHTML = `
    <div class="empty">
      <div class="big">${ICONS[p.id]}</div>
      <h2>${p.empty}</h2>
      <p>${p.emptyText}</p>
      ${p.built ? '<span class="note">Adding keyboards arrives in Step 2.2</span>' : ''}
    </div>`;
}

function route() {
  const id = (location.hash.match(/^#\/([a-z]+)/) || [])[1];
  const p = PAGES.find(x => x.id === id);
  if (p) { renderPage(p); show(pageView); }
  else {
    document.documentElement.style.setProperty('--accent', 'var(--kb)');
    document.title = 'Keyboard Collection';
    show(homeView);
  }
}
let openedFromHome = false; // true when a tile was tapped, so Back = history.back()
tilesEl.addEventListener('click', () => { openedFromHome = true; });
document.getElementById('backBtn').addEventListener('click', () => {
  if (openedFromHome) history.back();
  else location.hash = '';   // page was opened directly (bookmark or reload)
});
window.addEventListener('hashchange', () => {
  if (!location.hash || location.hash === '#/') openedFromHome = false;
  route();
});
route();

/* ===================== Protocol check (guardrail: Firestore rejects file://) ===================== */
const warn = document.getElementById('protoWarn');
const isFile = location.protocol === 'file:';
const isInsecure = location.protocol === 'http:' && !['localhost', '127.0.0.1'].includes(location.hostname);
if (isFile || isInsecure) {
  warn.style.display = 'block';
  warn.innerHTML = isFile
    ? '<strong>Opened from a file on this device.</strong> Sync will not work this way, because Firebase blocks file:// pages. Open <strong>https://fniskeebs69.github.io/keyboards/</strong> instead.'
    : '<strong>Not a secure connection.</strong> Open <strong>https://fniskeebs69.github.io/keyboards/</strong> so sync and installing work.';
}

/* ===================== Firebase init (no reads or writes in v0.1.0) ===================== */
const fbDot = document.getElementById('fbDot');
const fbText = document.getElementById('fbText');
let db = null;
try {
  if (typeof firebase === 'undefined') throw new Error('Firebase SDK did not load (offline?)');
  if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  if (isFile) { fbDot.className = 'dot bad'; fbText.textContent = 'Sync blocked (file://)'; }
  else { fbDot.className = 'dot ok'; fbText.textContent = 'Firebase ready · sync starts in Step 1.2'; }
} catch (err) {
  console.error(err);
  fbDot.className = 'dot bad';
  fbText.textContent = 'Firebase not loaded: ' + err.message;
}
</script>
</body>
</html>
